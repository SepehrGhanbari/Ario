name: A15 checkpoint under external R22.22 witness floor (read-only)
on:
  push:
    branches: [research/a15-r22-live-checkpoint-20261126]
    paths:
      - .github/workflows/a15-r22-external-floor-bridge.yml
      - implementation/research/a15_r22_live_v1/external_floor_bridge/**
      - implementation/tests/fixtures/a15_r22_run_45823494521/**
  pull_request:
    branches: [research/a15-r22-readonly-adapter-20261125]
    paths:
      - .github/workflows/a15-r22-external-floor-bridge.yml
      - implementation/research/a15_r22_live_v1/external_floor_bridge/**
      - implementation/tests/fixtures/a15_r22_run_45823494521/**
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned verification tools
        run: |
          python -m pip install coincurve==21.0.0
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Direct external signature and binding checks
        working-directory: implementation/research/a15_r22_live_v1/external_floor_bridge
        run: |
          set -euo pipefail
          go mod tidy
          go test -v .
          go run . --first-zip "$GITHUB_WORKSPACE/implementation/tests/fixtures/a15_r22_run_45823494521/A15-FIRST-ONLY.zip" --second-zip "$GITHUB_WORKSPACE/implementation/tests/fixtures/a15_r22_run_45823494521/A15-SECOND-REVEAL-SYNTHETIC.zip" --evidence-dir "$RUNNER_TEMP/a15-verified-signed-head"
      - uses: actions/upload-artifact@v4
        with:
          name: a15-direct-external-signed-head
          path: ${{ runner.temp }}/a15-verified-signed-head
          if-no-files-found: error
