name: A15 checkpoint under external R22.22 witness floor (read-only)
on:
  push:
    branches: [research/a15-r22-live-checkpoint-20261126]
    paths:
      - .github/workflows/a15-r22-external-floor-bridge.yml
      - implementation/research/a15_r22_live_v1/external_floor_bridge/**
      - implementation/tests/fixtures/a15_r22_run_45823494521/**
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2139914a255aa58b3706eaa401dc744fa82e8d56
          path: pinned-r22-22i
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Verify pinned external-floor source
        run: |
          set -euo pipefail
          test "$(git -C pinned-r22-22i rev-parse HEAD)" = 2139914a255aa58b3706eaa401dc744fa82e8d56
          test "$(git -C pinned-r22-22i rev-parse HEAD:implementation/research/r22_22_recovery_root/independent_witness_floor/EXTERNAL_FLOOR_2026-11-26_142338.json)" = 07b1172fd77cf53d9dba9b4e06215d33f42705cb
      - name: Install official Sigsum verifier
        run: |
          set -euo pipefail
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify A15 proofs are covered by the externally witnessed R22.22 floor
        working-directory: implementation/research/a15_r22_live_v1/external_floor_bridge
        run: |
          set -euo pipefail
          go run . \
            --first-zip "$GITHUB_WORKSPACE/implementation/tests/fixtures/a15_r22_run_45823494521/A15-FIRST-ONLY.zip" \
            --second-zip "$GITHUB_WORKSPACE/implementation/tests/fixtures/a15_r22_run_45823494521/A15-SECOND-REVEAL-SYNTHETIC.zip" \
            --external-floor-json "$GITHUB_WORKSPACE/pinned-r22-22i/implementation/research/r22_22_recovery_root/independent_witness_floor/EXTERNAL_FLOOR_2026-11-26_142338.json"
