name: A15 R22 live synthetic checkpoint (advisory)
on:
  push:
    branches: [research/a15-r22-live-checkpoint-20261126]
    paths: [.github/workflows/a15-r22-live-synthetic.yml]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Offline controls before publishing
        run: |
          set -euo pipefail
          python -m pip install coincurve==21.0.0 websockets==15.0.1
          python -m unittest discover -s implementation/tests -p test_a15_r22_readonly_adapter_v1.py -v
          python implementation/research/a15_r22_live_v1/live.py selftest "$RUNNER_TEMP/a15-selftest"
          for tool in sigsum-key sigsum-submit sigsum-verify; do
            go install "sigsum.org/sigsum-go/cmd/$tool@v0.14.1"
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Publish synthetic checkpoints and log event IDs
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/a15-live"
          python implementation/research/a15_r22_live_v1/live.py publish "$L"
          K=$(mktemp -d "$RUNNER_TEMP/a15-test-key.XXXXXX")
          chmod 0700 "$K"
          trap 'rm -rf "$K"' EXIT
          sigsum-key generate -o "$K/log-key"
          cp "$K/log-key.pub" "$L/first/log-key.pub"
          sigsum-submit -P sigsum-test1-2025 -k "$K/log-key" "$L/first/event-id.txt"
          sigsum-verify -k "$K/log-key.pub" -P sigsum-test1-2025 "$L/first/event-id.txt.proof" < "$L/first/event-id.txt"
          python implementation/research/a15_r22_live_v1/live.py bootstrap "$L/first" "$K/log-key.pub"
          sigsum-submit -P sigsum-test1-2025 -k "$K/log-key" "$L/second/event-id.txt"
          sigsum-verify -k "$K/log-key.pub" -P sigsum-test1-2025 "$L/second/event-id.txt.proof" < "$L/second/event-id.txt"
          python - "$L" <<'PY'
          import pathlib,sys,json
          p=pathlib.Path(sys.argv[1])
          def fields(f): return dict(s.split("=",1) for s in f.read_text().splitlines() if "=" in s)
          a=fields(p/"first/event-id.txt.proof"); b=fields(p/"second/event-id.txt.proof")
          assert a["log"]==b["log"]=="4e89cc51651f0d95f3c6127c15e1a42e3ddf7046c5b17b752689c402e773bb4d"
          assert a["leaf"].split()[0]==b["leaf"].split()[0]
          assert int(b["leaf_index"])>int(a["leaf_index"]) and int(b["size"])>int(a["size"])
          assert set(x.name for x in (p/"first").iterdir())=={"checkpoint.json","event.json","event-id.txt","event-id.txt.proof","nostr.pub","log-key.pub","sigsum.pub","bootstrap.json"}
          print(json.dumps({"stage":"A15_TWO_TEST_LEAVES","first":int(a["leaf_index"]),"second":int(b["leaf_index"]),"size":int(b["size"]),"private_keys_exported":False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: A15-FIRST-ONLY
          path: ${{ runner.temp }}/a15-live/first/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: A15-SECOND-REVEAL-SYNTHETIC
          path: ${{ runner.temp }}/a15-live/second/
          if-no-files-found: error
          retention-days: 30
  discover:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4ca8ba373cc687252bc06462986e5323f75a7bcc
          path: pinned-r22
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4bd0dc8aa04ce0fe0bf4a7b8394b81994a81b14
          path: pinned-r63
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned verifier and relay client
        run: |
          python -m pip install coincurve==21.0.0 websockets==15.0.1 cryptography==46.0.3
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: A15-FIRST-ONLY
          path: ${{ runner.temp }}/first
      - name: Verify first-only input and scan actual witnessed tree
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/first"; D="$RUNNER_TEMP/scanner"; mkdir "$D"
          test "$(git -C pinned-r22 rev-parse HEAD)" = 4ca8ba373cc687252bc06462986e5323f75a7bcc
          test "$(git -C pinned-r63 rev-parse HEAD)" = c4bd0dc8aa04ce0fe0bf4a7b8394b81994a81b14
          test "$(find "$F" -type f | wc -l)" -eq 8
          test ! -e "$RUNNER_TEMP/a15-live"
          test ! -e "$RUNNER_TEMP/second"
          sigsum-verify -k "$F/log-key.pub" -P sigsum-test1-2025 "$F/event-id.txt.proof" < "$F/event-id.txt"
          cp pinned-r22/implementation/research/r22_10_blind_discovery/{main.go,main_test.go,go.mod} "$D/"
          cp "$F/bootstrap.json" "$D/"
          cd "$D"
          go mod tidy
          go test -v ./...
          go run . | tee "$RUNNER_TEMP/discovery.jsonl"
      - name: Recover later checkpoint from relays
        run: |
          set -euo pipefail
          python implementation/research/a15_r22_live_v1/live.py discover "$RUNNER_TEMP/first" "$RUNNER_TEMP/discovery.jsonl" "$RUNNER_TEMP/recovered" | tee "$RUNNER_TEMP/recovery.jsonl"
      - name: Compare R63 direct monitor heads (separate advisory)
        run: |
          python implementation/research/a15_r22_live_v1/monitor.py pinned-r63/implementation/research/r63_external_floor_bridge/read_quorum "$RUNNER_TEMP/discovery.jsonl" "$RUNNER_TEMP/monitors" | tee "$RUNNER_TEMP/monitor.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A15-COLD-RECOVERY
          path: |
            ${{ runner.temp }}/discovery.jsonl
            ${{ runner.temp }}/recovery.jsonl
            ${{ runner.temp }}/recovered/
            ${{ runner.temp }}/monitors/
            ${{ runner.temp }}/monitor.jsonl
          if-no-files-found: warn
          retention-days: 30
  audit:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install reveal verification tools
        run: |
          python -m pip install coincurve==21.0.0
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: A15-FIRST-ONLY
          path: ${{ runner.temp }}/first
      - uses: actions/download-artifact@v4
        with:
          name: A15-SECOND-REVEAL-SYNTHETIC
          path: ${{ runner.temp }}/second
      - uses: actions/download-artifact@v4
        with:
          name: A15-COLD-RECOVERY
          path: ${{ runner.temp }}/blind
      - name: Verify reveal proofs and compare with synthetic Broker
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/first"; S="$RUNNER_TEMP/second"; B="$RUNNER_TEMP/blind"
          sigsum-verify -k "$F/log-key.pub" -P sigsum-test1-2025 "$F/event-id.txt.proof" < "$F/event-id.txt"
          sigsum-verify -k "$F/log-key.pub" -P sigsum-test1-2025 "$S/event-id.txt.proof" < "$S/event-id.txt"
          python - "$F" "$S" "$B" <<'PY'
          import json,hashlib,pathlib,sys
          f,s,b=map(pathlib.Path,sys.argv[1:])
          m=json.loads((b/"discovery.jsonl").read_text().splitlines()[-1])["matching_signed_leaves"]
          for i,p in enumerate((f,s)):
              e=json.loads((p/"event.json").read_text())
              raw=(p/"event-id.txt").read_bytes()
              assert raw==(e["id"]+"\n").encode("ascii")
              proof=dict(x.split("=",1) for x in (p/"event-id.txt.proof").read_text().splitlines() if "=" in x)
              assert int(proof["leaf_index"])==m[i]["index"]
              assert hashlib.sha256(hashlib.sha256(raw).digest()).hexdigest()==m[i]["checksum"]
          PY
          python implementation/research/a15_r22_live_v1/live.py audit "$F" "$S" "$B/recovered" "$B/discovery.jsonl" | tee "$RUNNER_TEMP/audit.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A15-LIVE-REVEAL-AUDIT
          path: ${{ runner.temp }}/audit.jsonl
          if-no-files-found: warn
          retention-days: 30
