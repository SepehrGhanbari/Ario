name: A15 R22 proof-envelope compatibility (read-only)
on:
  push:
    branches: [research/a15-r22-live-checkpoint-20261126]
    paths:
      - .github/workflows/a15-r22-proof-compatibility.yml
      - implementation/research/a15_r22_live_v1/proof_contract.py
      - implementation/research/a15_r22_live_v1/proof_contract_from_zips.py
      - implementation/research/a15_r22_live_v1/PROOF_ENVELOPE_COMPATIBILITY_V1.md
permissions:
  contents: read
  actions: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 255398a8e243d3738b132dafe0fe0edcaab29679
          path: pinned-r22-22g
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Install only offline verification dependencies
        run: |
          set -euo pipefail
          python -m pip install coincurve==21.0.0
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Fetch exact existing A15 artifacts (read-only, no publication)
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15118184755/zip" > "$RUNNER_TEMP/first.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15118049899/zip" > "$RUNNER_TEMP/second.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15119226101/zip" > "$RUNNER_TEMP/cold.zip"
          echo "f6012b78741a23992be901141fb8eb560f7010d17ecc4ccf4e71d3f917cd5f97  $RUNNER_TEMP/first.zip" | sha256sum -c -
          echo "4eec66aeb8036e9628094acbe815c7418e88836d064b384dcd0558ed4910f3ec  $RUNNER_TEMP/second.zip" | sha256sum -c -
          echo "b36acf47e4e2c82d6009c72957d8535536c6c1773cdd1967170107a31a05feac  $RUNNER_TEMP/cold.zip" | sha256sum -c -
      - name: Verify A15 envelope, archived proofs, and R22.20 cross-profile rejection
        run: |
          set -euo pipefail
          test "$(git -C pinned-r22-22g rev-parse HEAD)" = 255398a8e243d3738b132dafe0fe0edcaab29679
          python -I -B implementation/research/a15_r22_live_v1/proof_contract_from_zips.py \
            --first-zip "$RUNNER_TEMP/first.zip" \
            --second-zip "$RUNNER_TEMP/second.zip" \
            --cold-zip "$RUNNER_TEMP/cold.zip" \
            --r22-codec pinned-r22-22g/implementation/research/r22_22_recovery_root/generic_successor/event_codec.py \
            --r22-pure-verifier pinned-r22-22g/implementation/research/r22_22_recovery_root/verify_nostr_bip340.py \
            --sigsum-verify "$(go env GOPATH)/bin/sigsum-verify"
