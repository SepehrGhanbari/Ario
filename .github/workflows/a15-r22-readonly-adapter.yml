name: A15 R22 read-only checkpoint adapter (offline synthetic)

on:
  pull_request:
    paths:
      - 'implementation/research/a15_r22_readonly_adapter_v1.py'
      - 'implementation/tests/test_a15_r22_readonly_adapter_v1.py'
      - 'implementation/research/A15_R22_READONLY_ADAPTER_V1.md'
      - '.github/workflows/a15-r22-readonly-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile adapter and tests
        run: python -m py_compile implementation/research/a15_r22_readonly_adapter_v1.py implementation/tests/test_a15_r22_readonly_adapter_v1.py
      - name: Run offline synthetic read-only contract tests
        run: python -m unittest discover -s implementation/tests -p test_a15_r22_readonly_adapter_v1.py -v
