name: A15 R22 retained evidence reveal repair (read-only)
on:
  push:
    branches: [research/a15-r22-live-checkpoint-20261126]
    paths: [.github/workflows/a15-r22-retained-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  audit-retained:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c4bd0dc8aa04ce0fe0bf4a7b8394b81994a81b14
          path: pinned-r63
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install verification tools only
        run: |
          python -m pip install coincurve==21.0.0 cryptography==46.0.3
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Download exact original evidence archives, verify and extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in first:15118184755 second:15118049899 blind:15119226101; do
            name=${pair%:*}; id=${pair#*:}
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$name.zip"
          done
          python - "$RUNNER_TEMP" <<'PY'
          import pathlib,sys,zipfile,hashlib,stat
          p=pathlib.Path(sys.argv[1])
          expected={"first":"f6012b78741a23992be901141fb8eb560f7010d17ecc4ccf4e71d3f917cd5f97",
                    "second":"4eec66aeb8036e9628094acbe815c7418e88836d064b384dcd0558ed4910f3ec",
                    "blind":"b36acf47e4e2c82d6009c72957d8535536c6c1773cdd1967170107a31a05feac"}
          for name,digest in expected.items():
              raw=(p/(name+".zip")).read_bytes()
              assert hashlib.sha256(raw).hexdigest()==digest
              dest=p/name
              dest.mkdir()
              with zipfile.ZipFile(p/(name+".zip")) as z:
                  infos=z.infolist()
                  assert len(infos)<=128 and sum(i.file_size for i in infos)<2000000
                  assert len({i.filename for i in infos})==len(infos)
                  for i in infos:
                      q=pathlib.PurePosixPath(i.filename)
                      assert not q.is_absolute() and ".." not in q.parts and "\\" not in i.filename
                      assert not stat.S_ISLNK(i.external_attr>>16)
                  assert z.testzip() is None
                  z.extractall(dest)
              print("RETAINED_ARCHIVE_VERIFIED", name, digest)
          PY
      - name: Reverify both original inclusion proofs and reveal without republishing
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/first"; S="$RUNNER_TEMP/second"; B="$RUNNER_TEMP/blind"
          sigsum-verify -k "$F/log-key.pub" -P sigsum-test1-2025 "$F/event-id.txt.proof" < "$F/event-id.txt"
          sigsum-verify -k "$F/log-key.pub" -P sigsum-test1-2025 "$S/event-id.txt.proof" < "$S/event-id.txt"
          python - "$F" "$S" "$B" <<'PY'
          import json,hashlib,pathlib,sys
          f,s,b=map(pathlib.Path,sys.argv[1:])
          m=json.loads((b/"discovery.jsonl").read_text().splitlines()[-1])["matching_signed_leaves"]
          for i,p in enumerate((f,s)):
              e=json.loads((p/"event.json").read_text())
              raw=(p/"event-id.txt").read_bytes()
              assert raw==(e["id"]+"\n").encode("ascii")
              proof=dict(x.split("=",1) for x in (p/"event-id.txt.proof").read_text().splitlines() if "=" in x)
              assert int(proof["leaf_index"])==m[i]["index"]
              assert hashlib.sha256(hashlib.sha256(raw).digest()).hexdigest()==m[i]["checksum"]
          print("ORIGINAL_PROOFS_AND_DISCOVERY_BINDING_PASS")
          PY
          python implementation/research/a15_r22_live_v1/live.py audit "$F" "$S" "$B/recovered" "$B/discovery.jsonl" | tee "$RUNNER_TEMP/reveal-repair.jsonl"
      - name: Diagnose original R63 monitor bytes offline (no new network requests)
        if: always()
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/blind/monitors" "pinned-r63/implementation/research/r63_external_floor_bridge/read_quorum" <<'PY' | tee "$RUNNER_TEMP/monitor-diagnosis.jsonl"
          import pathlib,sys,json
          folder,source=map(pathlib.Path,sys.argv[1:])
          sys.path.insert(0,str(source.resolve()))
          from verify_witness import KEYS,note,ORIGIN
          for name in ("geomys","markovian"):
              p=folder/(name+".raw")
              try:
                  if not p.is_file(): raise ValueError("original response bytes unavailable")
                  raw=p.read_bytes()
                  body,sigs=raw.decode("utf-8").split("\n\n",1)
                  signer=KEYS[name].split("+",1)[0]
                  keep=[line for line in sigs.splitlines() if line.startswith("— "+ORIGIN+" ") or line.startswith("— "+signer+" ")]
                  normalized=(body+"\n\n"+"\n".join(keep)+"\n").encode()
                  size,root,ts=note(normalized,KEYS[name])
                  print(json.dumps({"monitor":name,"status":"VERIFIED_ORIGINAL_BYTES","size":size,"root":root.hex(),"timestamp":ts}))
              except Exception as e:
                  print(json.dumps({"monitor":name,"status":"HOLD","error":type(e).__name__,"detail":str(e)[:200]}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A15-RETAINED-AUDIT-REPAIR
          path: |
            ${{ runner.temp }}/reveal-repair.jsonl
            ${{ runner.temp }}/monitor-diagnosis.jsonl
          if-no-files-found: warn
          retention-days: 30
