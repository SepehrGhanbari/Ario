name: A15 R63 read-only reconciliation with R22.22D
on:
  push:
    branches: [research/a15-r22-live-checkpoint-20261126]
    paths:
      - .github/workflows/a15-r63-r22d-reconcile.yml
      - implementation/research/a15_r22_live_v1/r63_r22d_reconcile.py
      - implementation/research/a15_r22_live_v1/r63_r22d_reconcile.py
permissions:
  contents: read
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6b97e25cf1e399eb025eccc75f546f9ec15951f2
          path: pinned-r63
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install verifier dependency
        run: python -m pip install cryptography==46.0.3
      - name: Download exact retained A15 monitor archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15119226101/zip" > "$RUNNER_TEMP/a15-cold-recovery.zip"
          echo "A15_ARCHIVE_SHA256=$(sha256sum "$RUNNER_TEMP/a15-cold-recovery.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Test dual-signature normalization on retained exact notes
        run: |
          set -euo pipefail
          python -B -m py_compile implementation/research/a15_r22_live_v1/r63_r22d_reconcile.py implementation/research/a15_r22_live_v1/note_normalizer.py
          python implementation/research/a15_r22_live_v1/r63_r22d_reconcile.py selftest "$RUNNER_TEMP/a15-cold-recovery.zip" pinned-r63/implementation/research/r63_external_floor_bridge/read_quorum
      - name: Read current witness notes and verify consistency against R22.22D reference
        run: |
          set -euo pipefail
          python implementation/research/a15_r22_live_v1/r63_r22d_reconcile.py run "$RUNNER_TEMP/a15-cold-recovery.zip" pinned-r63/implementation/research/r63_external_floor_bridge/read_quorum "$RUNNER_TEMP/reconciliation" | tee "$RUNNER_TEMP/reconciliation.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A15-R63-R22-22D-READONLY-RECONCILIATION
          path: |
            ${{ runner.temp }}/reconciliation/
            ${{ runner.temp }}/reconciliation.json
          if-no-files-found: warn
          retention-days: 30
