name: A15 v0.3 hardened local lab
on:
  pull_request:
    paths:
      - 'implementation/research/a15_*v0_3.js'
      - 'implementation/research/A15_STAGE2_V03.md'
      - 'implementation/tests/test_a15_lab_v0_3.js'
      - '.github/workflows/a15-stage2-v03-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frozen G0/G1, historical v0.2, and new v0.3 tests
        run: |
          node --test implementation/tests/test_a15_research.js
          node --test implementation/tests/test_a15_lab_v0_2.js
          node --test implementation/tests/test_a15_lab_v0_3.js
