name: A15 v0.5 Custodian synthetic combined research
on:
  pull_request:
    paths:
      - 'implementation/research/a15_*v0_5.py'
      - 'implementation/research/a15_v05_linux_separated_broker_lab.sh'
      - 'implementation/research/A15_CUSTODIAN_BROKER_V05.md'
      - 'implementation/tests/test_a15_custodian_broker_v0_5.py'
      - 'implementation/research/a15_r22_readonly_adapter_v1.py'
      - 'implementation/tests/test_a15_r22_readonly_adapter_v1.py'
      - 'implementation/research/A15_R22_READONLY_ADAPTER_V1.md'
      - 'implementation/tests/test_a15_claude_delta_v0_3.js'
      - 'implementation/tests/test_a15_custody_gap_v0_4.js'
      - '.github/workflows/a15-v05-custodian-combined.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-synthetic:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen G0/G1, v0.2, maintained v0.3, Claude delta, and S9 RED
        run: |
          node --test implementation/tests/test_a15_research.js
          node --test implementation/tests/test_a15_lab_v0_2.js
          node --test implementation/tests/test_a15_lab_v0_3.js
          node --test implementation/tests/test_a15_claude_delta_v0_3.js
          node --test implementation/tests/test_a15_s9_v0_4.js
          node --test implementation/tests/test_a15_custody_gap_v0_4.js
      - name: Durable synthetic ledger, crashes, replay, corruption and rollback RED
        run: python -m unittest discover -s implementation/tests -p test_a15_custodian_broker_v0_5.py -v
      - name: A15 R22 read-only checkpoint adapter contract (offline synthetic)
        run: python -m unittest discover -s implementation/tests -p test_a15_r22_readonly_adapter_v1.py -v
  linux-principal-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux end-to-end peer-UID broker, kernel ACL, crash and retry
        shell: bash
        run: sudo -n bash implementation/research/a15_v05_linux_separated_broker_lab.sh
      - name: v0.4 Linux principal-isolation frozen control
        shell: bash
        run: sudo -n bash implementation/research/a15_s9_principal_probe_v0_4.sh
