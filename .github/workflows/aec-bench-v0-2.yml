name: AEC-Bench v0.2 Adapter Tests

on:
  pull_request:
    paths:
      - ".github/workflows/aec-bench-v0-2.yml"
      - "implementation/research/AEC_BENCH_V0_2_*.md"
      - "implementation/research/aec_benchmark_v0_2.py"
      - "implementation/research/aec_benchmark_v0_2_policy_comparison.py"
      - "implementation/research/aec_bench_v0_2_adapters/**"
      - "implementation/tests/test_aec_benchmark_v0_2.py"
      - "implementation/tests/test_aec_benchmark_v0_2_policy_comparison.py"
      - "implementation/tests/test_aec_bench_v0_2_adapters.py"
      - "implementation/tests/test_aec_bench_v0_2_ario_m0_adapter.py"
  push:
    paths:
      - ".github/workflows/aec-bench-v0-2.yml"
      - "implementation/research/AEC_BENCH_V0_2_*.md"
      - "implementation/research/aec_benchmark_v0_2.py"
      - "implementation/research/aec_benchmark_v0_2_policy_comparison.py"
      - "implementation/research/aec_bench_v0_2_adapters/**"
      - "implementation/tests/test_aec_benchmark_v0_2.py"
      - "implementation/tests/test_aec_benchmark_v0_2_policy_comparison.py"
      - "implementation/tests/test_aec_bench_v0_2_adapters.py"
      - "implementation/tests/test_aec_bench_v0_2_ario_m0_adapter.py"

permissions:
  contents: read

concurrency:
  group: aec-bench-v0-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned optional adapter dependencies
        run: python -m pip install pytest==9.1.1 -r research/aec_bench_v0_2_adapters/requirements-adapters.txt
      - name: Record runtime and dependency state
        run: |
          python -VV
          python -m pip check
          python -m pip freeze
      - name: Run AEC-Bench v0.2 and adapter tests
        run: python -m pytest -q tests/test_aec_benchmark_v0_2.py tests/test_aec_benchmark_v0_2_policy_comparison.py tests/test_aec_bench_v0_2_adapters.py tests/test_aec_bench_v0_2_ario_m0_adapter.py
      - name: Generate public fixture-contract report
        run: python -m research.aec_benchmark_v0_2 --output research/results/aec_bench_v0_2_development.json
      - name: Generate task-scoped policy-comparison report
        run: python -m research.aec_benchmark_v0_2_policy_comparison --output research/results/aec_bench_v0_2_policy_comparison.json
      - name: Generate direct Ario M0 runtime probe report
        run: python -c "import json; from pathlib import Path; from research.aec_bench_v0_2_adapters.ario_m0_eag_adapter import build_m0_probe_report; Path('research/results/aec_bench_v0_2_ario_m0_eag.json').write_text(json.dumps(build_m0_probe_report(), indent=2, sort_keys=True) + '\\n', encoding='utf-8')"
      - name: Upload public fixture and comparison reports
        uses: actions/upload-artifact@v4
        with:
          name: aec-bench-v0.2-reports-${{ github.sha }}
          path: |
            implementation/research/results/aec_bench_v0_2_development.json
            implementation/research/results/aec_bench_v0_2_policy_comparison.json
            implementation/research/results/aec_bench_v0_2_ario_m0_eag.json
          if-no-files-found: error
          retention-days: 90
