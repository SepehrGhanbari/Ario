name: AEC-Bench v0.2 Adapter Tests

on:
  pull_request:
    paths:
      - ".github/workflows/aec-bench-v0-2.yml"
      - "implementation/research/AEC_BENCH_V0_2_*.md"
      - "implementation/research/aec_benchmark_v0_2.py"
      - "implementation/research/aec_bench_v0_2_adapters/**"
      - "implementation/tests/test_aec_benchmark_v0_2.py"
      - "implementation/tests/test_aec_bench_v0_2_adapters.py"
  push:
    paths:
      - ".github/workflows/aec-bench-v0-2.yml"
      - "implementation/research/AEC_BENCH_V0_2_*.md"
      - "implementation/research/aec_benchmark_v0_2.py"
      - "implementation/research/aec_bench_v0_2_adapters/**"
      - "implementation/tests/test_aec_benchmark_v0_2.py"
      - "implementation/tests/test_aec_bench_v0_2_adapters.py"

permissions:
  contents: read

concurrency:
  group: aec-bench-v0-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned optional adapter dependencies
        run: python -m pip install -r research/aec_bench_v0_2_adapters/requirements-adapters.txt
      - name: Record runtime and dependency state
        run: |
          python -VV
          python -m pip check
          python -m pip freeze
      - name: Run AEC-Bench v0.2 and adapter tests
        run: python -m pytest -q tests/test_aec_benchmark_v0_2.py tests/test_aec_bench_v0_2_adapters.py
