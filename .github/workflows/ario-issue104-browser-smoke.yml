name: Ario #104 Browser Smoke (Research Demo)

on:
  push:
    branches:
      - research/issue104-demo-completion-20261122
    paths:
      - docs/ario-explainer-demo-2026-11-08/**
      - implementation/research/ario_issue104_browser_smoke.py
      - .github/workflows/ario-issue104-browser-smoke.yml

permissions:
  contents: read

jobs:
  static-demo-browser:
    if: github.repository == 'SepehrGhanbari/Ario' && github.ref == 'refs/heads/research/issue104-demo-completion-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pinned research candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Headless browser real DOM/interaction smoke in FA and EN
        run: |
          python -B implementation/research/ario_issue104_browser_smoke.py
