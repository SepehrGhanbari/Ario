name: R2.11 read-only external receipt verification
on:
  push:
    branches:
      - research/self-audit-r211-external-anchor-20261126
    paths:
      - research/self-audit-r2.11/verify_markovian_receipt.py
      - .github/workflows/ario-r211-readonly-verification.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography==44.0.3
      - name: Verify live public receipt, trust root, witness quorum and inclusion
        run: python research/self-audit-r2.11/verify_markovian_receipt.py
