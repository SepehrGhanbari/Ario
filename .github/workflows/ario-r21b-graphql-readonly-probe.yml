name: Ario R21B Read-Only GraphQL Schema Probe (Research)

on:
  push:
    branches:
      - research/r21b-graph-attribution-synthetic-20261122
    paths:
      - .github/workflows/ario-r21b-graphql-readonly-probe.yml
      - implementation/research/guard_v2_r21b_live_schema_probe.py

permissions:
  contents: read
  pull-requests: read

jobs:
  probe:
    if: github.repository == 'SepehrGhanbari/Ario' && github.ref == 'refs/heads/research/r21b-graph-attribution-synthetic-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify current branch and run bounded GraphQL query-only probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -B implementation/research/guard_v2_r21b_live_schema_probe.py
