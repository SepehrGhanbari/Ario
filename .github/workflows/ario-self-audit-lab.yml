name: Ario Repo Self Audit Research (advisory)

# PR checkout is untrusted. Never pass a GitHub API token, App signer,
# or other secrets to Python/dependencies installed from this checkout.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  repository-readback-research:
    name: self-audit-readback-research
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Checkout PR source for synthetic tests only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run bounded synthetic self-audit and Guard V2 controls
        run: >-
          python -B -m pytest -p no:cacheprovider -q
          tests/test_ario_repo_self_audit.py
          tests/test_guard_v2_pr_scope.py
          tests/test_guard_v2_live_link.py
          tests/test_guard_v2_review_graph.py
          tests/test_guard_v2_workflow_token_boundary.py
