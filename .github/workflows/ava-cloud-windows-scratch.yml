name: Ario Ava Cloud Windows Python Guard Scratch (no provider secrets)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ava-cloud-windows-scratch.yml"
      - ".gitattributes"
      - "experiments/ava-cloud-identity-2026-11-03/**"

# The workflow is a research-only native Windows scratch probe.
# A passing run does not authorize cloud dispatch, retry, trust, or merge.
# Python socket/urlopen guard covers this test process and child Python
# interpreters only; checkout and non-Python OS networking are NOT blocked.
# This is NOT an OS network-isolated security boundary.
permissions:
  contents: read

jobs:
  native-windows-scratch:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      OPENROUTER_API_KEY: ""
      PYTHONDONTWRITEBYTECODE: "1"
      ARIO_CI_PYTHON_NETWORK_DENY: "1"
      PYTHONPATH: "ci_guard"
    defaults:
      run:
        working-directory: experiments/ava-cloud-identity-2026-11-03
    steps:
      - name: Check out synthetic research source, without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify Python network guard and run native CRT, lock, CLI and JSONL scratch probes
        shell: pwsh
        run: |
          python -m unittest -v ci_guard.test_network_guard
          python -m unittest -v test_native_windows_recovery_smoke.py
