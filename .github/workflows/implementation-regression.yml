name: Implementation Regression

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  m0-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run M0 and runtime regression suites
        run: python -m pytest -q tests
      - name: Run cognitive memory, crash recovery, and security boundary suites
        run: |
          python -m pytest -v \
            tests/test_memory_consolidation.py \
            tests/test_source_monitoring.py \
            tests/test_prospective_memory.py \
            tests/test_cognitive_memory_integration.py \
            tests/test_cognitive_memory_security_boundaries.py \
            tests/test_cognitive_memory_cli.py \
            tests/test_cognitive_memory_crash_recovery.py \
            tests/test_ledger_memory_bridge.py \
            tests/test_working_memory.py \
            tests/test_working_memory_boundaries.py \
            tests/test_working_memory_benchmark.py \
            tests/test_working_memory_fuzz.py \
            tests/test_policy_comparison.py

      - name: PR298 synthetic Linux CLI peak-RSS experiment (256 MiB trial)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 298
        timeout-minutes: 6
        run: python -B research/pr298/linux_rss_probe.py

  cognitive-memory-invariants:
    name: Cognitive Memory Invariants, Crash Recovery & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Verify cognitive memory suite
        run: |
          python -m pytest -v \
            tests/test_memory_consolidation.py \
            tests/test_source_monitoring.py \
            tests/test_prospective_memory.py \
            tests/test_cognitive_memory_integration.py \
            tests/test_cognitive_memory_security_boundaries.py \
            tests/test_cognitive_memory_cli.py \
            tests/test_cognitive_memory_crash_recovery.py \
            tests/test_ledger_memory_bridge.py \
            tests/test_working_memory.py \
            tests/test_working_memory_boundaries.py \
            tests/test_working_memory_benchmark.py \
            tests/test_working_memory_fuzz.py \
            tests/test_policy_comparison.py
      - name: Repeat randomized tests with an explicit reproduction seed
        run: ARIO_FUZZ_SEED=8675309 python -m pytest -v tests/test_working_memory_fuzz.py
      - name: Run multi-scenario benchmarks and save machine-readable outputs
        run: |
          mkdir -p benchmark-artifacts
          python benchmarks/benchmark_working_memory.py --events 200 --capacity 4 --output benchmark-artifacts/working-memory.json
          python benchmarks/policy_comparison.py --events 200 --capacity 4 --seed 42 \
            --output benchmark-artifacts/policy-comparison.json \
            --markdown benchmark-artifacts/policy-comparison.md
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-memory-benchmarks-${{ github.run_id }}
          path: implementation/benchmark-artifacts/
          if-no-files-found: error
          retention-days: 30

  windows-differential-advisory:
    # Informational pilot. Do not configure this as a required status check.
    # Failure stays visible; no continue-on-error or fabricated success.
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Record Python and check installed dependencies
        run: |
          python -VV
          python -m pip check
      - name: Run Windows regression suites with bounded display IDs
        # Canonical runner temp avoids the default RUNNER~1 / runneradmin alias split.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -m pytest -p no:cacheprovider -p tests.test_m0_reproducibility_demo -q tests
      - name: PR298 synthetic Windows CLI peak-working-set experiment (256 MiB trial)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 298
        timeout-minutes: 6
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B research/pr298/windows_rss_probe.py

  python-314-differential-advisory:
    # Informational pilot, mirroring windows-differential-advisory.
    # Do not configure this as a required status check. Purpose: surface
    # verdicts that change with the interpreter rather than the input
    # (see issue #246). Failure stays visible; no continue-on-error.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Record Python and check installed dependencies
        run: |
          python -VV
          python -m pip check
      - name: Run M0 and runtime regression suites on CPython 3.14
        run: python -m pytest -q tests
