name: Implementation Regression

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  m0-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run M0 and runtime regression suites
        run: python -m pytest -q tests
