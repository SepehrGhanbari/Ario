name: Implementation Regression

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  m0-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run M0 and runtime regression suites
        run: python -m pytest -q tests

  windows-differential-advisory:
    # Informational pilot. Do not configure this as a required status check.
    # Failure stays visible; no continue-on-error or fabricated success.
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Record Python and check installed dependencies
        run: |
          python -VV
          python -m pip check
      - name: Run Windows regression suites with bounded display IDs
        # Canonical runner temp avoids the default RUNNER~1 / runneradmin alias split.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -m pytest -p no:cacheprovider -p tests.test_m0_reproducibility_demo -q tests
