name: Implementation Regression

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  m0-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run M0 and runtime regression suites
        run: python -m pytest -q tests

  windows-differential-advisory:
    # Informational pilot. Do not configure this as a required status check.
    # Failure stays visible; no continue-on-error or fabricated success.
    if: github.event_name == 'pull_request'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      # GitHub's account TEMP may use an 8.3 alias (RUNNER~1).
      # Internal-helper fixtures require a canonical workspace path.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    defaults:
      run:
        working-directory: implementation
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned research test dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Record Python and check installed dependencies
        run: |
          python -VV
          python -m pip check
      - name: Run Windows regression suites with bounded display IDs
        run: python -B -m pytest -p no:cacheprovider -p tests.test_m0_reproducibility_demo -q tests
