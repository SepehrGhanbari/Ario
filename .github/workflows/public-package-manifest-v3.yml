name: Public Package Manifest V3
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  manifest-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run manifest builder unit tests
        run: python -m unittest discover -s scripts -p test_public_package_manifest_v3.py -v
      - name: Rebuild V3 from pinned Git blobs
        run: >-
          python scripts/build_public_package_manifest_v3.py
          --repo .
          --manifest-v2 papers/creation-without-sovereignty/2026-11-11/PUBLIC_PACKAGE_FILE_MANIFEST.json
          --ref 2e7f83c6c7518012bed7fedfb12103ce9b7222ea
          --output manifest-v3.generated.json
      - name: Diagnose and verify committed V3 reproducibility
        run: python -c "from pathlib import Path; a=Path('manifest-v3.generated.json').read_bytes(); b=Path('papers/creation-without-sovereignty/2026-11-11/PUBLIC_PACKAGE_FILE_MANIFEST_V3.json').read_bytes(); i=next((i for i,(x,y) in enumerate(zip(a,b)) if x!=y),min(len(a),len(b))); print('offset',i,'generated_context',repr(a[max(0,i-160):i+80]),'committed_context',repr(b[max(0,i-160):i+80]),'sizes',len(a),len(b)); assert a==b, 'V3 differs from deterministic Git-blob rebuild'"
