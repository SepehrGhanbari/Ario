name: R22.12 blind external synthetic floor and ledger recovery (advisory)
on:
  push:
    branches:
      - research/r22-12-external-floor-preimage-20261124
    paths:
      - .github/workflows/r22-12-external-floor.yml
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install prior pinned TEST-log clients
        run: |
          set -euo pipefail
          for tool in sigsum-key sigsum-policy sigsum-submit sigsum-verify; do
            go install "sigsum.org/sigsum-go/cmd/$tool@v0.14.1"
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Generate first and second synthetic floor commitments
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m pip install -r requirements-research.txt
          mkdir -p "$RUNNER_TEMP/r22-12-first" "$RUNNER_TEMP/r22-12-reveal"
          PYTHONPATH=.:tests python - <<'PY'
          import hashlib, json, os, secrets
          from pathlib import Path
          from test_r22_7_retained_witness_floor import floor_record, ledger, r10
          from test_r22_5_replay_aba_boundary import sample
          from test_r22_6_ci_witness_prefix_integration import observed_rows
          from test_r22_8_witness_receipt_recovery import commitment
          root = Path(os.environ["RUNNER_TEMP"])
          world, observation = sample('aba')
          rows = observed_rows(world, observation, events=['PUBLIC-SYNTHETIC-PR-A-TO-B-'+secrets.token_hex(32), 'PUBLIC-SYNTHETIC-PR-B-TO-A-'+secrets.token_hex(32)])
          scope = secrets.token_hex(24)
          previous = "GENESIS"
          for count, folder in ((2, "first"), (4, "reveal")):
              record = floor_record(rows, count)
              folder_path = root / ("r22-12-" + folder)
              (folder_path / "floor.json").write_bytes(r10.canonical(record)+b"\n")
              (folder_path / "ledger.jsonl").write_bytes(ledger(rows[:count]))
              body = {
                  "profile": "ARIO-R22.10-PUBLIC-SYNTHETIC-FLOOR-v1",
                  "scope": scope,
                  "record_count": count,
                  "previous_checksum": previous,
                  "floor_commitment_sha256": commitment(record),
                  "synthetic_nonce": secrets.token_hex(32),
                  "synthetic": True,
                  "authoritative": False,
                  "historical_event_truth": "UNKNOWN",
                  "trust_activation": "NO_GO",
                  "production": "NO_GO",
              }
              raw = (json.dumps(body, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
              (root / ("r22-12-" + folder) / "envelope.json").write_bytes(raw)
              previous = hashlib.sha256(hashlib.sha256(raw).digest()).hexdigest()
          PY
      - name: Submit two sequential PUBLIC synthetic commitments with one ephemeral key
        timeout-minutes: 10
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/r22-12-first"
          B="$RUNNER_TEMP/r22-12-reveal"
          K=$(mktemp -d "$RUNNER_TEMP/r22-12-key.XXXXXX")
          trap 'rm -rf "$K"' EXIT
          chmod 0700 "$K"
          cd "$K"
          sigsum-key generate -o synthetic-key
          cp synthetic-key.pub "$A/synthetic-key.pub"
          cp synthetic-key.pub "$B/synthetic-key.pub"
          sigsum-policy show sigsum-test1-2025 > "$A/policy.txt"
          cp "$A/policy.txt" "$B/policy.txt"
          sigsum-submit -P sigsum-test1-2025 -k "$K/synthetic-key" "$A/envelope.json"
          sigsum-verify -k "$A/synthetic-key.pub" -P sigsum-test1-2025 "$A/envelope.json.proof" < "$A/envelope.json"
          echo R22_10_FIRST_PROOF_VERIFIED
          sigsum-submit -P sigsum-test1-2025 -k "$K/synthetic-key" "$B/envelope.json"
          sigsum-verify -k "$B/synthetic-key.pub" -P sigsum-test1-2025 "$B/envelope.json.proof" < "$B/envelope.json"
          echo R22_10_SECOND_PROOF_VERIFIED
      - name: Export first-only bootstrap and verify sequential publication
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, struct
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          a, b = root/"r22-12-first", root/"r22-12-reveal"
          def fields(p):
              lines = [line.split("=",1) for line in p.read_text().splitlines() if "=" in line]
              return {k:v for k,v in lines if k in ("size","root_hash","leaf_index","log","leaf")}
          x, y = fields(a/"envelope.json.proof"), fields(b/"envelope.json.proof")
          assert x["log"] == y["log"] == "4e89cc51651f0d95f3c6127c15e1a42e3ddf7046c5b17b752689c402e773bb4d"
          assert int(y["leaf_index"]) > int(x["leaf_index"])
          assert int(y["size"]) > int(x["size"])
          assert x["leaf"].split()[0] == y["leaf"].split()[0]
          blob = base64.b64decode((a/"synthetic-key.pub").read_text().split()[1], validate=True)
          n = int.from_bytes(blob[:4],"big")
          assert blob[4:4+n] == b"ssh-ed25519"
          assert int.from_bytes(blob[4+n:8+n],"big") == 32 and len(blob)==8+n+32
          public = blob[8+n:]
          assert hashlib.sha256(public).hexdigest() == x["leaf"].split()[0]
          first = hashlib.sha256(hashlib.sha256((a/"envelope.json").read_bytes()).digest()).hexdigest()
          boot = {"start":int(x["leaf_index"]), "size":int(x["size"]), "root":x["root_hash"],
                  "public":public.hex(), "first_checksum":first}
          (a/"bootstrap.json").write_text(json.dumps(boot,sort_keys=True)+"\n")
          (a/"local-state.json").write_text(json.dumps({"record_count":2,"checkpoint":first})+"\n")
          assert set(p.name for p in a.iterdir()) == {"bootstrap.json","local-state.json","envelope.json","envelope.json.proof","synthetic-key.pub","policy.txt","floor.json","ledger.jsonl"}
          PY
      - name: Publish second PUBLIC synthetic envelope to external tag-indexed relay
        run: |
          set -euo pipefail
          python -m pip install coincurve==21.0.0 websockets==15.0.1
          python implementation/research/r22_11_external_content/recovery.py publish "$RUNNER_TEMP/r22-12-reveal/envelope.json"
      - name: Publish separate PUBLIC synthetic floor and ledger bundle by committed floor digest
        working-directory: implementation
        run: |
          set -euo pipefail
          PIN=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["floor_commitment_sha256"])' "$RUNNER_TEMP/r22-12-reveal/envelope.json")
          PYTHONPATH=.:tests python research/r22_12_external_floor/floor_recovery.py publish "$RUNNER_TEMP/r22-12-reveal" "$PIN"
      - uses: actions/upload-artifact@v4
        with:
          name: r22-12-FIRST-ONLY
          path: ${{ runner.temp }}/r22-12-first/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r22-12-SECOND-REVEAL
          path: ${{ runner.temp }}/r22-12-reveal/
          if-no-files-found: error
          retention-days: 30
  discover:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install research-only relay client and execute controls
        run: |
          set -euo pipefail
          python -m pip install coincurve==21.0.0 websockets==15.0.1
          cd implementation/research/r22_11_external_content
          python -m unittest -v
      - name: Execute floor and ledger recovery negative controls
        working-directory: implementation
        run: |
          set -euo pipefail
          python -m pip install -r requirements-research.txt
          PYTHONPATH=.:tests:research/r22_12_external_floor python -m unittest discover -s research/r22_12_external_floor -v
      - uses: actions/download-artifact@v4
        with:
          name: r22-12-FIRST-ONLY
          path: ${{ runner.temp }}/r22-12-first
      - name: Blind readback from separate runner with first-only recovery material
        run: |
          set -euo pipefail
          LAB=$(mktemp -d "$RUNNER_TEMP/r22-12-recovery.XXXXXX")
          trap 'rm -rf "$LAB"' EXIT
          cp implementation/research/r22_10_blind_discovery/{main.go,main_test.go,go.mod} "$LAB/"
          cp "$RUNNER_TEMP/r22-12-first/"{bootstrap.json,local-state.json} "$LAB/"
          cd "$LAB"
          test ! -e "$RUNNER_TEMP/r22-12-reveal"
          test ! -e envelope.json.proof
          test ! -e synthetic-key.pub
          sha256sum local-state.json > before.sha256
          go mod tidy
          go test -v ./...
          go run . | tee "$RUNNER_TEMP/r22-12-discovery.jsonl"
          sha256sum -c before.sha256
          echo R22_10_LOCAL_STATE_UNCHANGED
      - name: Recover external bytes using only the independently discovered checksum
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/r22-12-first"
          test ! -e "$RUNNER_TEMP/r22-12-reveal"
          mkdir -p "$RUNNER_TEMP/r22-12-recovered"
          sha256sum "$A/local-state.json" > "$RUNNER_TEMP/r22-12-before.sha256"
          python implementation/research/r22_11_external_content/recovery.py recover "$A/envelope.json" "$A/bootstrap.json" "$RUNNER_TEMP/r22-12-discovery.jsonl" "$RUNNER_TEMP/r22-12-recovered/envelope.json" | tee "$RUNNER_TEMP/r22-12-recovered/report.jsonl"
          sha256sum -c "$RUNNER_TEMP/r22-12-before.sha256"
      - name: Recover full synthetic floor and ledger by the envelope floor digest
        working-directory: implementation
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/r22-12-first"
          B="$RUNNER_TEMP/r22-12-recovered"
          test ! -e "$RUNNER_TEMP/r22-12-reveal"
          test ! -e "$B/floor.json"
          test ! -e "$B/ledger.jsonl"
          sha256sum "$A/local-state.json" "$A/floor.json" "$A/ledger.jsonl" > "$RUNNER_TEMP/r22-12-old.sha256"
          PYTHONPATH=.:tests python research/r22_12_external_floor/floor_recovery.py recover "$A" "$B" "$RUNNER_TEMP/r22-12-discovery.jsonl" | tee "$B/floor-report.jsonl"
          sha256sum -c "$RUNNER_TEMP/r22-12-old.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: r22-12-EXTERNAL-RECOVERED
          path: ${{ runner.temp }}/r22-12-recovered/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r22-12-BLIND-DISCOVERY
          path: ${{ runner.temp }}/r22-12-discovery.jsonl
          if-no-files-found: error
          retention-days: 30
  reveal:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r22-12-FIRST-ONLY
          path: first
      - uses: actions/download-artifact@v4
        with:
          name: r22-12-SECOND-REVEAL
          path: reveal
      - uses: actions/download-artifact@v4
        with:
          name: r22-12-BLIND-DISCOVERY
          path: discovery
      - uses: actions/download-artifact@v4
        with:
          name: r22-12-EXTERNAL-RECOVERED
          path: recovered
      - name: Check blind discovery against withheld second bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def checksum(raw): return hashlib.sha256(hashlib.sha256(raw).digest()).hexdigest()
          a = Path("first/envelope.json").read_bytes()
          b = Path("reveal/envelope.json").read_bytes()
          x,y = json.loads(a),json.loads(b)
          boot = json.loads(Path("first/bootstrap.json").read_bytes())
          report = json.loads(Path("discovery/r22-12-discovery.jsonl").read_text().splitlines()[-1])
          proof = dict(line.split("=",1) for line in Path("reveal/envelope.json.proof").read_text().splitlines()
                       if line.startswith("leaf_index="))
          assert report["disposition"] == "HOLD_OPAQUE_NEW_SIGNED_COMMITMENT"
          assert report["recovered_content"] is False and report["verified_scope_sequence"] == "UNKNOWN"
          assert report["complete_sampled_suffix"] is True
          assert len(report["matching_signed_leaves"]) == 2
          first, second = report["matching_signed_leaves"]
          assert first["checksum"] == checksum(a) == boot["first_checksum"]
          assert second["checksum"] == checksum(b) and second["index"] == int(proof["leaf_index"])
          assert second["index"] > first["index"]
          recovered = Path("recovered/envelope.json").read_bytes()
          external = json.loads(Path("recovered/report.jsonl").read_text().splitlines()[-1])
          assert recovered == b and checksum(recovered) == second["checksum"]
          assert external["content_recovered"] is True and external["external_read_sources"]
          assert external["disposition"] == "RECOVERED_LINKED_SYNTHETIC_ENVELOPE_ONLY"
          assert external["floor_preimage_recovered"] is False and external["trust_activation"] == "NO_GO"
          assert Path("recovered/floor.json").read_bytes() == Path("reveal/floor.json").read_bytes()
          assert Path("recovered/ledger.jsonl").read_bytes() == Path("reveal/ledger.jsonl").read_bytes()
          assert Path("recovered/ledger.jsonl").read_bytes().startswith(Path("first/ledger.jsonl").read_bytes())
          floor_result = json.loads(Path("recovered/floor-report.jsonl").read_text().splitlines()[-1])
          assert floor_result["disposition"] == "RECOVERED_LINKED_SYNTHETIC_FLOOR_AND_LEDGER_ONLY"
          assert floor_result["floor_preimage_recovered"] is True and floor_result["ledger_preimage_recovered"] is True
          assert floor_result["external_read_sources"] and floor_result["verified_record_count"] == 4
          assert floor_result["floor_commitment"] == y["floor_commitment_sha256"]
          assert floor_result["ledger_sha256"] == hashlib.sha256(Path("reveal/ledger.jsonl").read_bytes()).hexdigest()
          assert floor_result["trust_activation"] == "NO_GO"
          print("R22_12_EXTERNAL_FLOOR_AND_LEDGER_MATCH_WITHHELD_BYTES")
          print("R22_11_EXTERNAL_BYTES_MATCH_WITHHELD_ORIGINAL")
          assert x["scope"] == y["scope"] and y["previous_checksum"] == checksum(a)
          assert x["record_count"] == 2 and y["record_count"] == 4
          assert x["synthetic"] is True and y["synthetic"] is True
          assert x["authoritative"] is False and y["authoritative"] is False
          print(json.dumps({"result":"WITHHELD_BYTES_MATCH_DISCOVERED_CHECKSUM",
                            "first_index":first["index"],"second_index":second["index"],
                            "second_checksum":second["checksum"],"record_count":y["record_count"],
                            "global_latest":"NOT_ESTABLISHED","trust_activation":"NO_GO"},sort_keys=True))
          PY
