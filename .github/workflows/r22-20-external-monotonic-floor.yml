name: R22.20 external monotonic floor (advisory)
on:
  push:
    branches:
      - research/r22-20-external-monotonic-floor-20261125
    paths:
      - .github/workflows/r22-20-external-monotonic-floor.yml
      - implementation/research/r22_20_external_monotonic_floor/**
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned TEST-log tools and Nostr research client
        run: |
          set -euo pipefail
          for tool in sigsum-key sigsum-submit sigsum-verify; do
            go install "sigsum.org/sigsum-go/cmd/$tool@v0.14.1"
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          python -m pip install coincurve==21.0.0 websockets==15.0.1
      - name: Retrieve and verify exact R22.15B six-record anchor
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/r22-20"; mkdir -p "$L/prior"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14954102679/zip" > "$L/prior.zip"
          echo 'd3b860cc3c0167e8d709a5336a26be231e8143e188b2094250e3fbb1f71ea3db  '"$L/prior.zip" | sha256sum -c -
          python - "$L/prior.zip" "$L/prior" <<'PY'
          import pathlib,sys,zipfile
          zpath,out=map(pathlib.Path,sys.argv[1:])
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              wanted=("key.pub","six/envelope.json","six/envelope.json.proof","six/ledger.jsonl")
              assert all(n in z.namelist() for n in wanted)
              for n in wanted:
                  p=out/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          PY
          sigsum-verify -k "$L/prior/key.pub" -P sigsum-test1-2025 "$L/prior/six/envelope.json.proof" < "$L/prior/six/envelope.json"
          python - "$L/prior/six" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);e=json.loads((p/"envelope.json").read_bytes());l=(p/"ledger.jsonl").read_bytes()
          assert e["record"]["seq"]==6
          assert e["record"]["ledger_sha256"]==hashlib.sha256(l).hexdigest()
          assert e["scope"] and len(e["scope"])==48
          print("R22_20_R22_15B_ANCHOR_VERIFIED",hashlib.sha256((p/"envelope.json").read_bytes()).hexdigest())
          PY
      - name: Offline adversarial envelope and replay controls
        run: |
          set -euo pipefail
          cd implementation/research/r22_20_external_monotonic_floor
          python -m unittest -v test_external_floor
      - name: Publish seq 6 and seq 8 content to external Nostr relays
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/r22-20"
          python implementation/research/r22_20_external_monotonic_floor/external_floor.py prepare "$L/prior" "$L/publisher"
      - name: Log only the first Nostr event identifier, then create blind bootstrap
        run: |
          set -euo pipefail
          L="$RUNNER_TEMP/r22-20"
          K=$(mktemp -d "$RUNNER_TEMP/r22-20-log-key.XXXXXX")
          trap 'rm -rf "$K"' EXIT
          chmod 0700 "$K"
          cd "$K"
          sigsum-key generate -o floor-log-key
          cp floor-log-key.pub "$L/publisher/first/log-key.pub"
          sigsum-submit -P sigsum-test1-2025 -k "$K/floor-log-key" "$L/publisher/first/event-id.txt"
          sigsum-verify -k "$K/floor-log-key.pub" -P sigsum-test1-2025 "$L/publisher/first/event-id.txt.proof" < "$L/publisher/first/event-id.txt"
          python "$GITHUB_WORKSPACE/implementation/research/r22_20_external_monotonic_floor/external_floor.py" bootstrap "$L/publisher/first" "$K/floor-log-key.pub"
          sigsum-submit -P sigsum-test1-2025 -k "$K/floor-log-key" "$L/publisher/second/event-id.txt"
          sigsum-verify -k "$K/floor-log-key.pub" -P sigsum-test1-2025 "$L/publisher/second/event-id.txt.proof" < "$L/publisher/second/event-id.txt"
          python - "$L/publisher" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          def fields(p):
              d={}
              for line in p.read_text().splitlines():
                  k,sep,v=line.partition("=")
                  if sep and k in ("size","root_hash","leaf_index","log","leaf"):
                      assert k not in d;d[k]=v
              return d
          a=fields(root/"first/event-id.txt.proof");b=fields(root/"second/event-id.txt.proof")
          assert a["log"]==b["log"]=="4e89cc51651f0d95f3c6127c15e1a42e3ddf7046c5b17b752689c402e773bb4d"
          assert a["leaf"].split()[0]==b["leaf"].split()[0]
          assert int(b["leaf_index"])>int(a["leaf_index"]) and int(b["size"])>int(a["size"])
          assert not (root/"first"/"second").exists()
          print("R22_20_TWO_ORDERED_SIGSUM_TEST_LEAVES")
          PY
      - name: Terminate publisher session before blind recovery
        run: sleep 12
      - uses: actions/upload-artifact@v4
        with:
          name: r22-20-FIRST-ONLY
          path: \${{ runner.temp }}/r22-20/publisher/first/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: r22-20-SECOND-REVEAL
          path: \${{ runner.temp }}/r22-20/publisher/second/
          if-no-files-found: error
          retention-days: 30
  discover:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Install untrusted relay parser dependencies
        run: python -m pip install coincurve==21.0.0 websockets==15.0.1
      - uses: actions/download-artifact@v4
        with:
          name: r22-20-FIRST-ONLY
          path: \${{ runner.temp }}/first-only
      - name: Prove the cold runner received no second event or reveal material
        run: |
          set -euo pipefail
          F="$RUNNER_TEMP/first-only"
          test -f "$F/bootstrap.json"
          test -f "$F/event.json"
          test ! -e "$F/second"
          test ! -e "$RUNNER_TEMP/r22-20/publisher/second"
          find "$F" -maxdepth 1 -type f -printf '%f\n' | sort
          sha256sum "$F"/* > "$RUNNER_TEMP/first-before.sha256"
      - name: Build unchanged official Sigsum cosigned-tree scanner
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/scanner"; mkdir -p "$D"
          cp implementation/research/r22_10_blind_discovery/{main.go,main_test.go,go.mod} "$D/"
          cd "$D"; go mod tidy; go test -v ./...; go build -o "$RUNNER_TEMP/r22-20-scanner" .
      - name: Discover later event-id commitment from the live witnessed tree
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/scanner"; cp "$RUNNER_TEMP/first-only/bootstrap.json" "$D/"
          cd "$D"
          go run . | tee "$RUNNER_TEMP/discovery.jsonl"
      - name: Recover seq 8 from public relays using only the discovered checksum
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovered"
          python implementation/research/r22_20_external_monotonic_floor/external_floor.py recover "$RUNNER_TEMP/first-only" "$RUNNER_TEMP/discovery.jsonl" "$RUNNER_TEMP/recovered" | tee "$RUNNER_TEMP/recovery-report.jsonl"
          sha256sum -c "$RUNNER_TEMP/first-before.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: r22-20-BLIND-RECOVERY
          path: |
            \${{ runner.temp }}/discovery.jsonl
            \${{ runner.temp }}/recovery-report.jsonl
            \${{ runner.temp }}/recovered/
          if-no-files-found: error
          retention-days: 30
  audit:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install independent reveal verifier
        run: python -m pip install coincurve==21.0.0
      - uses: actions/download-artifact@v4
        with:
          name: r22-20-FIRST-ONLY
          path: \${{ runner.temp }}/first
      - uses: actions/download-artifact@v4
        with:
          name: r22-20-SECOND-REVEAL
          path: \${{ runner.temp }}/second
      - uses: actions/download-artifact@v4
        with:
          name: r22-20-BLIND-RECOVERY
          path: \${{ runner.temp }}/blind
      - name: Compare blind recovery with withheld original and exact Sigsum inclusion
        run: |
          set -euo pipefail
          python implementation/research/r22_20_external_monotonic_floor/audit.py "$RUNNER_TEMP/first" "$RUNNER_TEMP/second" "$RUNNER_TEMP/blind/recovered" "$RUNNER_TEMP/blind/discovery.jsonl" | tee "$RUNNER_TEMP/audit-report.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: r22-20-AUDIT-REPORT
          path: \${{ runner.temp }}/audit-report.jsonl
          if-no-files-found: error
          retention-days: 30
