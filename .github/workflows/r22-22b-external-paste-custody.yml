name: R22.22B external paste custody and repo-rollback readback (advisory)
on:
  push:
    branches: [research/r22-22-independent-recovery-root-20261125]
    paths:
      - .github/workflows/r22-22b-external-paste-custody.yml
permissions:
  contents: read
concurrency:
  group: r22-22b-external-paste-custody
  cancel-in-progress: false
jobs:
  pin-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      paste_rs_url: \${{ steps.pin.outputs.paste_rs_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Read back the already-published external copy; do not republish
        id: pin
        run: |
          set -euo pipefail
          url="https://paste.rs/m18dx"
          curl --fail --silent --show-error "$url" -o "$RUNNER_TEMP/pin.json"
          python - "$RUNNER_TEMP/pin.json" <<'PY'
          import base64,hashlib,json,pathlib,sys
          o=json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          expected="304765d8d7f0da2d5e62443b7d1f48c00c8ff9bd324b8f8ed9c88c0ab7fffe24"
          assert o["profile"]=="ARIO-R22.22B-EXTERNAL-KIT-COPY"
          raw=base64.b64decode(o["kit_base64"],validate=True)
          assert len(raw)==o["kit_bytes"] and hashlib.sha256(raw).hexdigest()==expected==o["kit_sha256"]
          print("EXTERNAL_PASTE_EXACT_PIN_READBACK",expected,len(raw))
          PY
          echo "paste_rs_url=$url" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP/pin.json" "$RUNNER_TEMP/evidence/pin.json"
          printf '%s\n' "$url" > "$RUNNER_TEMP/evidence/paste-rs.url"
          sha256sum "$RUNNER_TEMP/pin.json" > "$RUNNER_TEMP/evidence/pin.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: r22-22b-external-pin-evidence
          path: \${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
  cold:
    needs: pin-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e32a29470fdac4638e842052ce0caf2491fa93b1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Recover portable kit from external paste after repository checkout rollback
        env:
          PASTE_RS_URL: \${{ needs.pin-check.outputs.paste_rs_url }}
        run: |
          set -euo pipefail
          test -n "$PASTE_RS_URL"
          curl --fail --silent --show-error "$PASTE_RS_URL" -o "$RUNNER_TEMP/pin.json"
          python - "$RUNNER_TEMP/pin.json" "$RUNNER_TEMP/kit.zip" <<'PY'
          import base64,hashlib,json,pathlib,sys
          expected="304765d8d7f0da2d5e62443b7d1f48c00c8ff9bd324b8f8ed9c88c0ab7fffe24"
          o=json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          assert o["profile"]=="ARIO-R22.22B-EXTERNAL-KIT-COPY"
          raw=base64.b64decode(o["kit_base64"],validate=True)
          assert len(raw)==o["kit_bytes"] and hashlib.sha256(raw).hexdigest()==expected==o["kit_sha256"]
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          print("PASTE_RS_EXTERNAL_STORE_EXACT_MATCH",expected,len(raw))
          PY
          mkdir "$RUNNER_TEMP/kit"
          unzip -q "$RUNNER_TEMP/kit.zip" -d "$RUNNER_TEMP/kit"
          test ! -e implementation/research/r22_22_recovery_root/RECOVERY_PIN.json
          bash "$RUNNER_TEMP/kit/read_only.sh" "$RUNNER_TEMP/readback"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-22b-cold-readback
          path: \${{ runner.temp }}/readback/
          if-no-files-found: warn
          retention-days: 30
