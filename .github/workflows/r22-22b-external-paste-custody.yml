name: R22.22B independent paste custody and repo-rollback readback (advisory)
on:
  push:
    branches: [research/r22-22-independent-recovery-root-20261125]
    paths:
      - .github/workflows/r22-22b-external-paste-custody.yml
permissions:
  contents: read
concurrency:
  group: r22-22b-external-paste-custody
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    outputs:
      dpaste_url: ${{ steps.pin.outputs.dpaste_url }}
      paste_rs_url: ${{ steps.pin.outputs.paste_rs_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Retrieve and verify the exact portable kit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15047820982/zip" > "$RUNNER_TEMP/artifact.zip"
          mkdir "$RUNNER_TEMP/artifact"
          unzip -q "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/artifact"
          test -f "$RUNNER_TEMP/artifact/kit.zip"
          echo "304765d8d7f0da2d5e62443b7d1f48c00c8ff9bd324b8f8ed9c88c0ab7fffe24  $RUNNER_TEMP/artifact/kit.zip" | sha256sum -c -
          python - "$RUNNER_TEMP/artifact/kit.zip" "$RUNNER_TEMP/pin.json" <<'PY'
          import base64,hashlib,json,sys,pathlib
          p=pathlib.Path(sys.argv[1]); raw=p.read_bytes()
          obj={"profile":"ARIO-R22.22B-EXTERNAL-KIT-COPY","kit_sha256":hashlib.sha256(raw).hexdigest(),
               "kit_bytes":len(raw),"capsule_id":"5f678677cf26986b76c552a8bb0ecc97db74d12ae3b7212697eee34db5fe32d5",
               "sigsum_tree_size":281670,"sigsum_tree_root":"dafc6911b16d150b1628937dd5030ba1b188b6ffe916837d41db37e4b867cefc",
               "kit_base64":base64.b64encode(raw).decode("ascii")}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(obj,sort_keys=True,separators=(",",":"))+"\n",encoding="ascii")
          print("PIN_PAYLOAD_SHA256",hashlib.sha256(pathlib.Path(sys.argv[2]).read_bytes()).hexdigest())
          PY
      - name: Publish to two separate public storage services and verify exact readback
        id: pin
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/pin.json"
          # dpaste: explicit 365-day expiry; anonymous public copy.
          ds=$(curl --silent --show-error --output "$RUNNER_TEMP/dpaste.response" --write-out '%{http_code}' \
            -F "content=<$P" -F "syntax=json" -F "title=ARIO-R22.22B-portable-kit" -F "expiry_days=365" \
            https://dpaste.com/api/v2/)
          test "$ds" = "200" -o "$ds" = "201"
          dresp=$(tr -d '\r\n ' < "$RUNNER_TEMP/dpaste.response")
          if [[ "$dresp" == http* ]]; then
            dpaste_url="${dresp%.txt}.txt"
          else
            dpaste_url="https://dpaste.com/${dresp}.txt"
          fi
          curl --fail --silent --show-error "$dpaste_url" -o "$RUNNER_TEMP/dpaste.readback.json"
          cmp "$P" "$RUNNER_TEMP/dpaste.readback.json"
          # paste.rs: separate operator/service; retention is not promised.
          ps=$(curl --silent --show-error --output "$RUNNER_TEMP/paste-rs.response" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -H 'User-Agent: Ario-R22.22B-Research/1.0' \
            --data-binary "@$P" https://paste.rs/)
          test "$ps" = "201"
          paste_rs_url=$(tr -d '\r\n ' < "$RUNNER_TEMP/paste-rs.response")
          case "$paste_rs_url" in https://paste.rs/*) ;; *) echo "unexpected paste.rs URL" >&2; exit 1;; esac
          curl --fail --silent --show-error "$paste_rs_url" -o "$RUNNER_TEMP/paste-rs.readback.json"
          cmp "$P" "$RUNNER_TEMP/paste-rs.readback.json"
          echo "DPASTE_URL=$dpaste_url"
          echo "PASTE_RS_URL=$paste_rs_url"
          echo "dpaste_url=$dpaste_url" >> "$GITHUB_OUTPUT"
          echo "paste_rs_url=$paste_rs_url" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/evidence"
          cp "$P" "$RUNNER_TEMP/evidence/pin.json"
          cp "$RUNNER_TEMP/dpaste.readback.json" "$RUNNER_TEMP/evidence/dpaste.readback.json"
          cp "$RUNNER_TEMP/paste-rs.readback.json" "$RUNNER_TEMP/evidence/paste-rs.readback.json"
          printf '%s\n' "$dpaste_url" > "$RUNNER_TEMP/evidence/dpaste.url"
          printf '%s\n' "$paste_rs_url" > "$RUNNER_TEMP/evidence/paste-rs.url"
          sha256sum "$P" "$RUNNER_TEMP/artifact/kit.zip" > "$RUNNER_TEMP/evidence/hashes.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: r22-22b-external-pin-evidence
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
  cold:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e32a29470fdac4638e842052ce0caf2491fa93b1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Recover the portable kit from external stores after repository checkout rollback
        env:
          DPASTE_URL: ${{ needs.publish.outputs.dpaste_url }}
          PASTE_RS_URL: ${{ needs.publish.outputs.paste_rs_url }}
        run: |
          set -euo pipefail
          test -n "$DPASTE_URL" && test -n "$PASTE_RS_URL"
          mkdir "$RUNNER_TEMP/external"
          curl --fail --silent --show-error "$DPASTE_URL" -o "$RUNNER_TEMP/external/dpaste.json"
          curl --fail --silent --show-error "$PASTE_RS_URL" -o "$RUNNER_TEMP/external/paste-rs.json"
          python - "$RUNNER_TEMP/external" <<'PY'
          import base64,hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1]); expected="304765d8d7f0da2d5e62443b7d1f48c00c8ff9bd324b8f8ed9c88c0ab7fffe24"
          blobs=[]
          for name in ("dpaste.json","paste-rs.json"):
              o=json.loads((p/name).read_bytes())
              assert o["profile"]=="ARIO-R22.22B-EXTERNAL-KIT-COPY"
              raw=base64.b64decode(o["kit_base64"],validate=True)
              assert len(raw)==o["kit_bytes"] and hashlib.sha256(raw).hexdigest()==expected==o["kit_sha256"]
              blobs.append(raw)
          assert blobs[0]==blobs[1]
          (p/"kit.zip").write_bytes(blobs[0])
          print("BOTH_EXTERNAL_STORES_EXACT_MATCH",expected,len(blobs[0]))
          PY
          mkdir "$RUNNER_TEMP/kit"
          unzip -q "$RUNNER_TEMP/external/kit.zip" -d "$RUNNER_TEMP/kit"
          # The repository itself is checked out at the older R22.21 parent.
          test ! -e implementation/research/r22_22_recovery_root/RECOVERY_PIN.json
          bash "$RUNNER_TEMP/kit/read_only.sh" "$RUNNER_TEMP/readback"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-22b-cold-readback
          path: ${{ runner.temp }}/readback/
          if-no-files-found: warn
          retention-days: 30
