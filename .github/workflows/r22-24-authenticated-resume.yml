name: R22.24 authenticated resume (advisory)
on:
  push:
    branches: [research/r22-24-authenticated-resume-20261126]
    paths:
      - .github/workflows/r22-24-authenticated-resume.yml
      - implementation/research/r22_24_authenticated_resume/*.go
permissions:
  contents: read
jobs:
  interrupt:
    outputs:
      pin: ${{ steps.stop.outputs.pin }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - name: Recover original portable kit without artifact or publication
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 https://paste.rs/m18dx -o "$RUNNER_TEMP/pin.json"
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,zipfile,io
          p=pathlib.Path(os.environ['RUNNER_TEMP']); raw=(p/'pin.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='c122dc2fcdbfc304ffe6db809dec2e7e14d3feced480918b7cbc2d6a3edd0f69'
          assert raw.endswith(bytes([92,110]))
          b=base64.b64decode(json.loads(raw[:-2])['kit_base64'],validate=True)
          assert hashlib.sha256(b).hexdigest()=='304765d8d7f0da2d5e62443b7d1f48c00c8ff9bd324b8f8ed9c88c0ab7fffe24'
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              assert z.testzip() is None
              z.extractall(p/'kit')
          PY
          python -m pip install coincurve==21.0.0 websockets==15.0.1
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          python "$RUNNER_TEMP/kit/r22_21_bootstrap_capsule/capsule.py" recover 5f678677cf26986b76c552a8bb0ecc97db74d12ae3b7212697eee34db5fe32d5 "$RUNNER_TEMP/first" | tee "$RUNNER_TEMP/bootstrap.jsonl"
          F="$RUNNER_TEMP/first"
          "$(go env GOPATH)/bin/sigsum-verify" -k "$F/historical-log.pub" -P sigsum-test1-2025 "$F/historical-first.proof" < "$F/historical-first-id.txt"
          "$(go env GOPATH)/bin/sigsum-verify" -k "$F/sigsum.pub" -P sigsum-test1-2025 "$F/event-id.txt.proof" < "$F/event-id.txt"
      - name: Run tests then deliberately exit after authenticated durable checkpoint
        id: stop
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/scan"; H="$RUNNER_TEMP/handoff"; mkdir "$S" "$H"
          cp implementation/research/r22_24_authenticated_resume/*.go "$S/"
          cp "$RUNNER_TEMP/kit/r22_10_blind_discovery/go.mod" "$S/"
          cp "$RUNNER_TEMP/first/bootstrap.json" "$S/"
          cd "$S"
          go mod tidy
          go test -count=1 -v ./... | tee "$H/tests.log"
          go build -o scan .
          set +e
          ./scan start > "$H/interrupt.json"
          rc=$?
          set -e
          cat "$H/interrupt.json"
          test "$rc" -eq 75
          cp next-checkpoint.json "$H/checkpoint.json"
          cp bootstrap.json go.mod "$H/"
          python - "$H" <<'PY'
          import json,hashlib,pathlib,sys,os
          p=pathlib.Path(sys.argv[1]); r=json.loads((p/"interrupt.json").read_bytes())
          pin=hashlib.sha256((p/"checkpoint.json").read_bytes()).hexdigest()
          assert r["result"]=="HOLD_SCAN_INCOMPLETE_CHECKPOINT_SAVED"
          assert r["complete_sampled_suffix"] is False and r["cursor"]==281670+512
          assert r["checkpoint_sha256"]==pin and r["scan_target"]>r["cursor"]
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("pin="+pin+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r22-24-checkpoint-handoff
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 30
  resume:
    needs: interrupt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: r22-24-checkpoint-handoff
          path: ${{ runner.temp }}/handoff
      - name: Resume in a new runner without fetching any earlier suffix leaves
        env:
          EXPECTED_CHECKPOINT_SHA256: ${{ needs.interrupt.outputs.pin }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/scan"; H="$RUNNER_TEMP/handoff"; mkdir "$S"
          cp implementation/research/r22_24_authenticated_resume/*.go "$S/"
          cp "$H"/{bootstrap.json,checkpoint.json,go.mod} "$S/"
          cd "$S"; go mod tidy; go build -o scan .
          echo "$EXPECTED_CHECKPOINT_SHA256  checkpoint.json" | sha256sum -c -
          ./scan resume | tee "$RUNNER_TEMP/resume.json"
          python3 - "$H/interrupt.json" "$RUNNER_TEMP/resume.json" <<'PY'
          import json,sys
          a,b=map(lambda p:json.load(open(p)),sys.argv[1:])
          assert b["result"]=="AUTHENTICATED_COMPLETE_SAMPLED_SUFFIX"
          assert b["scan_start"]==a["cursor"] and b["sampled_tree_size"]==a["scan_target"]
          assert b["scan_end_exclusive"]==a["scan_target"]
          assert b["processed_this_process"]==a["scan_target"]-a["cursor"]
          assert b["total_suffix"]==a["scan_target"]-281670
          assert b["reconstructed_root"]=="MATCH" and b["complete_sampled_suffix"] is True
          assert b["freshness"]=="UNKNOWN" and b["trust_activation"]=="NO_GO"
          print("R22_24_COLD_RESUME_EXACT_COORDINATES_PASS")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-24-resume-result
          path: ${{ runner.temp }}/resume.json
          if-no-files-found: warn
          retention-days: 30
