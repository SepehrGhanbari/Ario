name: R22.27 durable witness crash model (advisory)
on:
  push:
    branches: [research/r22-27-durable-witness-20261126]
    paths:
      - .github/workflows/r22-27-durable-witness.yml
      - implementation/research/r22_27_durable_witness/*.go
      - implementation/research/r22_27_durable_witness/go.mod
permissions:
  contents: read
jobs:
  crash-model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Durable state, crash and concurrent process tests
        working-directory: implementation/research/r22_27_durable_witness
        run: |
          set -euo pipefail
          go test -count=1 -v ./... | tee "$RUNNER_TEMP/r22-27-tests.log"
          go test -race -count=1 ./...
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-27-durable-witness-evidence
          path: ${{ runner.temp }}/r22-27-tests.log
          if-no-files-found: warn
          retention-days: 30
