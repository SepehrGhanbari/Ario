name: R22.29 TPM policy-gated signing (swtpm model)
on:
  push:
    branches: [research/r22-29-tpm-policy-gate-20261126]
    paths:
      - .github/workflows/r22-29-tpm-policy-gate.yml
      - implementation/research/r22_29_tpm_policy_gate/**
permissions:
  contents: read
jobs:
  policy-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install TPM simulator and TPM2 tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tpm2-tools swtpm swtpm-tools openssl
      - name: Run TPM policy and rollback-boundary tests
        working-directory: implementation/research/r22_29_tpm_policy_gate
        run: |
          set -euo pipefail
          bash run_swtpm_policy.sh 2>&1 | tee "$RUNNER_TEMP/r22-29-tpm-policy.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r22-29-tpm-policy-evidence
          path: ${{ runner.temp }}/r22-29-tpm-policy.log
          if-no-files-found: warn
          retention-days: 30
