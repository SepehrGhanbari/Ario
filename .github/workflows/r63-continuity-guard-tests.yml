name: R63 continuity guard adversarial tests (research)
on:
  push:
    branches: [research/r63-r22-external-floor-bridge-20261124]
    paths:
      - .github/workflows/r63-continuity-guard-tests.yml
      - implementation/research/r63_external_floor_bridge/continuity_guard/**
permissions:
  contents: read
jobs:
  continuity-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned crypto dependency
        run: python -m pip install cryptography==46.0.3
      - name: Compile and run offline adversarial suite
        working-directory: implementation/research/r63_external_floor_bridge/continuity_guard
        run: |
          python -B -m py_compile continuity_guard.py test_continuity_guard.py
          python -B -m unittest -v test_continuity_guard.py
