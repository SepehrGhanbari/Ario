name: R63 G4 founder-compatible Windows PowerShell 5.1 guest acceptance
on:
  push:
    branches:
      - research/r63-g4-guest-external-floor-20261121
    paths:
      - .github/workflows/r63-g4-founder-ps51.yml
      - research/r63_g4_peer_ci/**
      - research/r63_g3_witness_ci/spend_chain_v2.py
permissions:
  contents: read
jobs:
  offline-evidence-auditor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Audit positive and negative raw ZIP controls
        shell: pwsh
        run: |
          python -B research/r63_g4_peer_ci/test_audit_g4_evidence.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  native-g4-windows-ps51:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Execute exact guest-controller source in native Windows PowerShell 5.1
        shell: pwsh
        run: |
          Write-Host 'RESEARCH_ONLY; ephemeral Windows accounts; no real Ario keys'
          $winps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $winps -NoProfile -NonInteractive -ExecutionPolicy Bypass -File research/r63_g4_peer_ci/Invoke-G4PeerIdentityGuest.ps1 -Mode CI *> R63-G4-CI-Launch.log
          $exit = $LASTEXITCODE
          Get-Content R63-G4-CI-Launch.log
          if ($exit -ne 0) { exit $exit }
          $zip=(Get-ChildItem R63-G4-Evidence-*.zip | Select-Object -First 1).FullName
          python -B research/r63_g4_peer_ci/audit_g4_evidence.py $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve raw guest-compatible evidence and RED logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r63-g4-founder-ps51-${{ github.run_id }}
          path: |
            R63-G4-CI-Launch.log
            R63-G4-Run-*.txt
            R63-G4-Report-*.json
            R63-G4-Evidence-*.zip
          if-no-files-found: warn
          retention-days: 30
