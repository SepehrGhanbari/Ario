name: R63 G4 exact guest controller pwsh7 cross-check
on:
  push:
    branches:
      - research/r63-g4-guest-external-floor-20261121
    paths:
      - .github/workflows/r63-g4-guest-pwsh7-crosscheck.yml
permissions:
  contents: read
jobs:
  native-g4-guest-controller-pwsh7:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Execute exact G4 guest-controller source under PowerShell 7 as comparison
        shell: pwsh
        run: |
          & ./research/r63_g4_peer_ci/Invoke-G4PeerIdentityGuest.ps1 -Mode CI *> R63-G4-Pwsh7-Run.log
          $rc=if ($?) {0} else {1}
          Get-Content R63-G4-Pwsh7-Run.log
          if ($rc -ne 0) {exit $rc}
          $zip=(Get-ChildItem R63-G4-Evidence-*.zip | Select-Object -First 1).FullName
          python -B research/r63_g4_peer_ci/audit_g4_evidence.py $zip
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Archive raw G4 evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r63-g4-guest-pwsh7-${{ github.run_id }}
          path: |
            R63-G4-Pwsh7-Run.log
            R63-G4-Run-*.txt
            R63-G4-Report-*.json
            R63-G4-Evidence-*.zip
          if-no-files-found: warn
          retention-days: 30
