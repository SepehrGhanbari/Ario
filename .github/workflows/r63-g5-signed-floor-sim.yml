name: R63 G5 signed latest-floor custody research (simulation only)
on:
  push:
    branches:
      - research/r63-g4-guest-external-floor-20261121
    paths:
      - .github/workflows/r63-g5-signed-floor-sim.yml
      - research/r63_g5_floor_custody_ci/**
permissions:
  contents: read
jobs:
  monotonic-external-floor-model:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned research-only Ed25519 dependency
        shell: pwsh
        run: |
          python -m pip install cryptography==46.0.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Signed floor and deliberately unsafe same-admin rollback negative controls
        shell: pwsh
        run: |
          Write-Host 'SIMULATION_ONLY; NO EXTERNAL OPERATOR; NO ARIO KEY; NO REAL CUSTODY'
          python -W error::ResourceWarning -B -m unittest -v research/r63_g5_floor_custody_ci/test_custodian_floor_demo.py *> r63-g5-floor-sim.log
          $code=$LASTEXITCODE
          Get-Content r63-g5-floor-sim.log
          if ($code -ne 0) { exit $code }
      - name: Preserve full signed-floor regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r63-g5-floor-sim-${{ matrix.os }}-${{ github.run_id }}
          path: r63-g5-floor-sim.log
          if-no-files-found: warn
          retention-days: 30
