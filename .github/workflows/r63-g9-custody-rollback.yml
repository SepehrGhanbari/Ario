name: R63 G9 separate-SID consume fence / shared-admin rollback RED (synthetic only)
on:
  push:
    branches:
      - research/r63-g9-custody-rollback-native-20261124
    paths:
      - .github/workflows/r63-g9-custody-rollback.yml
      - research/r63_g9_custody_ci/**
      - research/r63_g5_floor_custody_ci/offline_minimum_extension/**
      - research/r63_g5_floor_custody_ci/g7_native_checkpoint/**
permissions:
  contents: read
jobs:
  native-custody-fence-and-negative-counterexample:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reconstruct audited synthetic G6 seq4 and G7 fixed payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $g6='research/r63_g5_floor_custody_ci/offline_minimum_extension'
          python -B (Join-Path $g6 'build_g6_fixtures.py')
          if($LASTEXITCODE -ne 0){throw 'G9_BAD_G6_SOURCE'}
          python -B (Join-Path $g6 'test_g6_extension_gate.py')
          if($LASTEXITCODE -ne 0){throw 'G9_BAD_G6_TEST'}
          python -B 'research/r63_g5_floor_custody_ci/g7_native_checkpoint/test_g7_preflight.py'
          if($LASTEXITCODE -ne 0){throw 'G9_BAD_G7_TEST'}
          $p=Join-Path $env:RUNNER_TEMP 'g9-source-bound-payload'
          python -B 'research/r63_g5_floor_custody_ci/g7_native_checkpoint/g7_preflight.py' --mode prepare --g6-dir $g6 --out $p
          if($LASTEXITCODE -ne 0){throw 'G9_PINNED_SOURCE_FAILED'}
          Write-Host 'G9_STATIC_SOURCE_BOUND_SEQ4=PASS'
      - name: Native distinct SID custodian, rollback fence, and deliberately RED shared-admin bypass
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path (Join-Path $env:RUNNER_TEMP 'g9-source-bound-payload') 'payload.bin'
          & './research/r63_g9_custody_ci/Invoke-G9-NativeE2ECI.ps1' -PayloadFile $p
          if(-not $?) {throw 'G9_NATIVE_CUSTODY_EXPERIMENT_HOLD'}
      - name: Preserve public-only reports and nested evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r63-g9-native-${{ github.run_id }}
          path: |
            r63-g9-native-report-*.json
            r63-g9-native-evidence-*.zip
          if-no-files-found: warn
          retention-days: 30

  independent-public-evidence-audit:
    name: Linux independent public ECDSA / custody marker audit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    needs: native-custody-fence-and-negative-counterexample
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: r63-g9-native-${{ github.run_id }}
          path: g9-public-artifact
      - name: Recompute actor and two native P-256 signatures, confirm retained-floor HOLD and shared-admin RED
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'cryptography==46.0.4'
          python -B research/r63_g9_custody_ci/audit_g9_public_evidence.py g9-public-artifact
          python -B research/r63_g9_custody_ci/test_audit_g9_public_evidence.py g9-public-artifact
          echo 'G9_INDEPENDENT_PUBLIC_CRYPTO_SIGNATURES=4_PASS'
          echo 'G9_DISTINCT_SID_CUSTODY_HOLD=PASS'
          echo 'G9_COMMON_ADMIN_CAN_RESIGN=RED_REPRODUCED'
          echo 'G9_INDEPENDENT_CUSTODY=NOT_ESTABLISHED'
