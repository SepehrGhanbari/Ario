name: R63 V10 journal contract model (research only)
on:
  push:
    branches:
      - research/r63-v10-windows-ci-smoke-20261117
    paths:
      - .github/workflows/r63-v10-journal-model.yml
      - research/r63_v10_ci/**
permissions:
  contents: read
jobs:
  cross-platform-model:
    name: synthetic-only / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Synthetic-only boundary
        shell: pwsh
        run: |
          Write-Host 'RESEARCH_ONLY / MODEL_NOT_NATIVE / NO_CNG / NO_SERVICE / NO_REAL_KEY'
          python -VV
      - name: Run model tests and preserve failure evidence
        shell: pwsh
        run: |
          python -B -m unittest discover -s research/r63_v10_ci -p 'test_*.py' -v *> r63-v10-model-tests.log
          $rc = $LASTEXITCODE
          Get-Content r63-v10-model-tests.log
          if ($rc -ne 0) { exit $rc }
      - name: Preserve model log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r63-v10-model-${{ matrix.os }}-${{ github.run_id }}
          path: r63-v10-model-tests.log
          if-no-files-found: error
          retention-days: 30
