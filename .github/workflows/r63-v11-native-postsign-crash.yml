name: R63 V11 synthetic native post-sign forced-exit recovery
on:
  push:
    branches:
      - research/r63-v10-windows-ci-smoke-20261117
    paths:
      - .github/workflows/r63-v11-native-postsign-crash.yml
      - research/r63_v10_native_replay_ci/Invoke-DisposableCrashSigner.ps1
      - research/r63_v10_native_replay_ci/test_native_postsign_recovery.py
      - research/r63_v10_native_replay_ci/Invoke-NativePublicReceipt.ps1
      - research/r63_v10_native_replay_ci/prepare_public_payload.py
      - research/r63_v10_native_replay_ci/verify_durable_snapshot.py
      - research/r63_v10_source_gate/spend_chain_v2.py
      - research/r63_v10_source_gate/.gitattributes
permissions:
  contents: read
jobs:
  synthetic-native-postsign-recovery:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Research-only scope
        shell: pwsh
        run: |
          Write-Host 'RESEARCH_ONLY / NO_REAL_KEYS / NO_SERVICE / NO_HOST_CHANGES'
          Write-Host 'FORCED EXIT ONLY AFTER EPHEMERAL KEY CLEANUP; NOT V9 RPC WITNESS'
          python -VV
      - name: Native CNG post-sign forced-exit and 2/8/16 recovery requests
        shell: pwsh
        run: |
          python -B research/r63_v10_native_replay_ci/test_native_postsign_recovery.py *> r63-v11-postsign-run.log
          $code = $LASTEXITCODE
          Get-Content r63-v11-postsign-run.log
          if ($code -ne 0) { exit $code }
          Get-Content (Join-Path $env:${{ runner.temp }} 'r63-v11-ci-postsign-abort/report.json')
      - name: Preserve bounded public evidence including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r63-v11-native-postsign-${{ github.run_id }}
          path: |
            r63-v11-postsign-run.log
            ${{ runner.temp }}/r63-v11-ci-postsign-abort/report.json
            ${{ runner.temp }}/r63-v11-ci-postsign-abort/AfterReceiptBeforeAck/receipt-public.json
            ${{ runner.temp }}/r63-v11-ci-postsign-abort/AfterReceiptBeforeAck/expected-public-pin.sha256
            ${{ runner.temp }}/r63-v11-ci-postsign-abort/AfterReceiptBeforeAck/use-entered.json
            ${{ runner.temp }}/r63-v11-ci-postsign-abort/AfterReceiptBeforeAck/use-returned.json
            ${{ runner.temp }}/r63-v11-ci-postsign-abort/AfterSignBeforeReceipt/use-entered.json
            ${{ runner.temp }}/r63-v11-ci-postsign-abort/AfterSignBeforeReceipt/use-returned.json
          if-no-files-found: warn
          retention-days: 30
