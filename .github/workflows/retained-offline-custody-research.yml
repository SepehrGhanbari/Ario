name: Retained offline custody research
on:
  pull_request:
    branches: [main]
    paths:
      - 'implementation/research/r63_external_floor_bridge/continuity_guard/**'
      - 'implementation/research/r22_25_independent_keeper/**'
      - 'implementation/research/r22_23_offline_frontier/**'
      - '.github/workflows/retained-offline-custody-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install cryptography==46.0.3
      - working-directory: implementation/research/r63_external_floor_bridge/continuity_guard
        run: python -B -m unittest -v test_continuity_guard.py
  offline-go:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false
      - working-directory: implementation/research/r22_25_independent_keeper
        run: go test -race -v .
      - working-directory: implementation/research/r22_23_offline_frontier
        run: go test -v .
