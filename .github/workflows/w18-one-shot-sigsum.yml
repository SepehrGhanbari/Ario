name: "W18 one-shot Sigsum public research receipt"
on:
  push:
    branches:
      - research/w18-sigsum-one-shot-run-20261117
    paths:
      - research/consensus/W18_ONE_SHOT_TRIGGER_2026-11-17.txt

permissions:
  contents: read

jobs:
  one-shot-public-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOTOOLCHAIN: local
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Checkout frozen W18 research source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false

      - name: Fail-closed offline public-manifest checks
        shell: bash
        run: |
          set -euo pipefail
          bash research/consensus/test_w18_sigsum_dryrun.sh
          sha256sum research/consensus/W18_PUBLIC_RESEARCH_ANCHOR_MANIFEST_2026-11-17.json

      - name: Build official version-pinned Sigsum tools
        shell: bash
        run: |
          set -euo pipefail
          go install sigsum.org/sigsum-go/cmd/sigsum-key@v0.14.1
          go install sigsum.org/sigsum-go/cmd/sigsum-policy@v0.14.1
          go install sigsum.org/sigsum-go/cmd/sigsum-submit@v0.14.1
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Submit exactly pinned public-only W18 manifest once and verify 2-of-3 policy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/w18-sigsum-one-shot-run-20261117'
          test -f research/consensus/W18_ONE_SHOT_TRIGGER_2026-11-17.txt
          mkdir -p w18-public-output
          timeout 360s env ARIO_W18_PUBLIC_SUBMISSION_APPROVED=YES \
            bash research/consensus/w18_sigsum_one_shot.sh --submit \
              research/consensus/W18_PUBLIC_RESEARCH_ANCHOR_MANIFEST_2026-11-17.json \
              "$PWD/w18-public-output/receipt"
          bash research/consensus/w18_sigsum_one_shot.sh --verify \
            w18-public-output/receipt/manifest.json \
            w18-public-output/receipt/submitter.pub \
            w18-public-output/receipt/manifest.proof
          echo "W18_PUBLIC_PROOF_VERIFIED_WITH_OFFICIAL_BUILTIN_POLICY"
          echo "W18_PROOF_SHA256=$(sha256sum w18-public-output/receipt/manifest.proof | cut -d' ' -f1)"
          echo "W18_SUBMITTER_PUB_BASE64_BEGIN"
          base64 -w0 w18-public-output/receipt/submitter.pub
          echo
          echo "W18_SUBMITTER_PUB_BASE64_END"
          echo "W18_SIGSUM_PROOF_BASE64_BEGIN"
          base64 -w0 w18-public-output/receipt/manifest.proof
          echo
          echo "W18_SIGSUM_PROOF_BASE64_END"

      - name: Archive public receipt (never the ephemeral private signing key)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: W18-Sigsum-public-proof-one-shot
          path: w18-public-output/receipt/
          if-no-files-found: error
          retention-days: 30
