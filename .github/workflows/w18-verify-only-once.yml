name: "W18 proof-only independent runner replay"
on:
  push:
    branches:
      - research/w18-sigsum-one-shot-run-20261117
    paths:
      - research/consensus/W18_VERIFY_ONLY_TRIGGER_2026-11-17.txt

permissions:
  contents: read

jobs:
  offline-proof-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch precise research commit containing authentic public receipt
        uses: actions/checkout@v4
        with:
          ref: "6aa96d34b2547ac3b55cb63327e94caf8103efeb"
          persist-credentials: false

      - name: Install Go required by signed Sigsum tools
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Compile ONLY offline Sigsum verifier; no submitter, no network publication
        shell: bash
        run: |
          set -euo pipefail
          go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.14.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify real proof and reject 4 corrupted variants
        shell: bash
        run: |
          set -euo pipefail
          bash research/consensus/w18_verify_actual_proof_no_network.sh | tee W18_VERIFIER_ONLY_RESULT.txt
          grep -Fq 'W18_OFFLINE_REVERIFY_RESULT=PASS_VALID_AND_4_EXPECTED_REJECTIONS' W18_VERIFIER_ONLY_RESULT.txt

      - name: Archive verifier-only public text result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: W18-Sigsum-offline-verification-only
          path: W18_VERIFIER_ONLY_RESULT.txt
          retention-days: 30
          if-no-files-found: error
