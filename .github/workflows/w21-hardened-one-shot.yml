name: "W21 one-shot hardened HTTP observer no-redirect replay"
on:
  push:
    branches:
      - research/w21-redirect-hardened-one-shot-20261117
    paths:
      - research/consensus/W21_HARDENED_ONE_SHOT_TRIGGER_2026-11-17.txt

permissions:
  contents: read
jobs:
  loopback-http-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact reviewed W21 source
        uses: actions/checkout@v4
        with:
          ref: "ebed96629829705919e8fcec2e7b6d5cdea52f6f"
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install synthetic crypto verifier
        run: python -m pip install 'cryptography==46.0.4'
      - name: Four real W21 test groups include HTTP redirect origin escape prevention
        shell: bash
        run: |
          set -euo pipefail
          cd research/consensus
          python -B -m unittest -v test_w21_http_monitor.py 2>&1 | tee W21_HARDENED_HTTP_STDOUT.txt
          grep -Fq 'test_redirect_cannot_escape_single_allowed_origin' W21_HARDENED_HTTP_STDOUT.txt
          grep -Fq 'Ran 4 tests' W21_HARDENED_HTTP_STDOUT.txt
          grep -Fq 'OK' W21_HARDENED_HTTP_STDOUT.txt
          python -B -m unittest -q test_w20_native_log.py 2>&1 | tee W21_HARDENED_W20_STDOUT.txt
          grep -Fq 'Ran 6 tests' W21_HARDENED_W20_STDOUT.txt
          grep -Fq 'OK' W21_HARDENED_W20_STDOUT.txt
          echo "W21_HARDENED_REDIRECT_REPLAY=PASS / W20_INTEGRITY=PASS / REAL_ARIO_WITNESS=NO / AUTHORITY=NONE"
      - name: Archive only read-only stdout, no secrets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: W21-hardened-readonly-http-proof-replay
          path: |
            research/consensus/W21_HARDENED_HTTP_STDOUT.txt
            research/consensus/W21_HARDENED_W20_STDOUT.txt
          if-no-files-found: error
          retention-days: 30
