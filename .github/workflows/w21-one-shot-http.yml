name: "W21 one-time read-only loopback log observer replay"
on:
  push:
    branches:
      - research/w21-one-shot-http-monitor-replay-20261117
    paths:
      - research/consensus/W21_ONE_SHOT_REPLAY_TRIGGER_2026-11-17.txt

permissions:
  contents: read

jobs:
  read-only-http-w21:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact public W21 source commit
        uses: actions/checkout@v4
        with:
          ref: "f26a479e6c1f893f05bc96fd49c8b06cecba206a"
          persist-credentials: false

      - name: Install Python on disposable GitHub runner
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install only Ed25519 public-checking dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'cryptography==46.0.4'

      - name: Test W21 loopback HTTP from separate processes
        shell: bash
        run: |
          set -euo pipefail
          cd research/consensus
          python -B -m unittest -v test_w21_http_monitor.py 2>&1 | tee W21_ACTUAL_TEST_STDOUT.txt
          grep -Fq 'Ran 3 tests' W21_ACTUAL_TEST_STDOUT.txt
          grep -Fq 'OK' W21_ACTUAL_TEST_STDOUT.txt
          echo "W21_HTTP_LOOPBACK_MULTIPROCESS_TESTS=PASS"

      - name: Check unchanged underlying W20 Merkle verification controls
        shell: bash
        run: |
          set -euo pipefail
          cd research/consensus
          python -B -m unittest -q test_w20_native_log.py 2>&1 | tee W21_W20_INTEROP_STDOUT.txt
          grep -Fq 'Ran 6 tests' W21_W20_INTEROP_STDOUT.txt
          grep -Fq 'OK' W21_W20_INTEROP_STDOUT.txt
          echo "W21_COMPACT_PROOF_INTEROP_TESTS=PASS"

      - name: Archive read-only execution stdout only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: W21-one-shot-public-synthetic-http-replay
          path: |
            research/consensus/W21_ACTUAL_TEST_STDOUT.txt
            research/consensus/W21_W20_INTEROP_STDOUT.txt
          if-no-files-found: error
          retention-days: 30
