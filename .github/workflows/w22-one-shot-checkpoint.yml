name: "W22 one-time C2SP note and partial tiles research replay"
on:
  push:
    branches:
      - research/w22-c2sp-checkpoint-one-shot-20261117
    paths:
      - research/consensus/W22_ONE_SHOT_REPLAY_TRIGGER_2026-11-17.txt

permissions:
  contents: read

jobs:
  bounded-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact original tested source commit
        uses: actions/checkout@v4
        with:
          ref: "d07620afa5e0e2f69daa6284ba0789b3a5957840"
          persist-credentials: false

      - name: Install pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Go for independent-language note verifier
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Install strict research-only public-key library
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'cryptography==46.0.4'

      - name: Verify 8 Python methods, 10 mutations, original C2SP key example and Go positive/negative
        shell: bash
        run: |
          set -euo pipefail
          cd research/consensus
          bash w22_replay_no_egress.sh 2>&1 | tee W22_ACTUAL_RUN_STDOUT.txt
          grep -Fq 'Ran 8 tests' W22_ACTUAL_RUN_STDOUT.txt
          grep -Fq 'W22_SELECTED_MUTANTS=10/10_Detected' W22_ACTUAL_RUN_STDOUT.txt
          grep -Fq 'W22_GO_REJECTS_MALFORMED_SIZE_AND_VALIDATES_BOTH_C2SP_NOTES' W22_ACTUAL_RUN_STDOUT.txt
          grep -Fq 'W22_REPLAY_PASS' W22_ACTUAL_RUN_STDOUT.txt

      - name: Archive only public no-secret replay outcome
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: W22-C2SP-checkpoint-and-tiles-replay
          path: |
            research/consensus/W22_ACTUAL_RUN_STDOUT.txt
            research/consensus/W22_SELECTED_MUTATION_REPLAY.json
          if-no-files-found: error
          retention-days: 30
