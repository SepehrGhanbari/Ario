name: W23 synthetic signed-gossip replay (temporary research CI)
on:
  pull_request:
    paths:
      - 'research/consensus/w23_checkpoint_gossip.py'
      - 'research/consensus/test_w23_checkpoint_gossip.py'
      - '.github/workflows/w23-gossip-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w23-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bounded verifier dependency (no production keys)
        run: python -m pip install 'cryptography==46.0.4'
      - name: Run source-pinned offline W23 synthetic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w23_checkpoint_gossip.py -v
