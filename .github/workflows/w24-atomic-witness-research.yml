name: W24 synthetic atomic witness research (temporary)
on:
  pull_request:
    paths:
      - 'research/consensus/w24_atomic_witness_lab.py'
      - 'research/consensus/test_w24_atomic_witness.py'
      - '.github/workflows/w24-atomic-witness-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w24:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install one bounded verifier dependency
        run: python -m pip install 'cryptography==46.0.4'
      - name: Execute research tests with no signer or secret
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w24_atomic_witness.py -v
