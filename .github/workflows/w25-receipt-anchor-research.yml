name: W25 synthetic receipt and two-store anchor research (one-shot)
on:
  pull_request:
    paths:
      - 'research/consensus/w25_receipt_anchor_lab.py'
      - 'research/consensus/test_w25_receipt_anchor.py'
      - '.github/workflows/w25-receipt-anchor-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w25:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned public test verifier dependency
        run: python -m pip install 'cryptography==46.0.4'
      - name: Run offline W25 lab tests against real W23 and W22 research fixtures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w25_receipt_anchor.py -v
