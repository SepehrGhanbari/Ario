name: W29 dual observation crash rollback research (one-shot)
on:
  pull_request:
    paths:
      - 'research/consensus/w29_dual_observer_rollback_lab.py'
      - 'research/consensus/test_w29_dual_observer_rollback_lab.py'
      - '.github/workflows/w29-dual-observers-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w29:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install strict signed W22 note verifier dependency
        run: python -m pip install 'cryptography==46.0.4'
      - name: Run offline W29 40 actual multi-process and rollback cases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w29_dual_observer_rollback_lab.py -v
