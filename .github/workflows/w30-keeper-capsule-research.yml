name: W30 offline keeper capsule rotation and revocation research (one-shot)
on:
  pull_request:
    paths:
      - 'research/consensus/w30_offline_custodian_capsules.py'
      - 'research/consensus/test_w30_offline_custodian_capsules.py'
      - '.github/workflows/w30-keeper-capsule-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w30:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ['3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install strictly bounded verifier dependency only
        run: python -m pip install 'cryptography==46.0.4'
      - name: W30 original W22 signature and 60 synthetic receipt falsifiers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w30_offline_custodian_capsules.py -v
