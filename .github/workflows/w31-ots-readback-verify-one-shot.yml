name: W31 READ-ONLY parse two external pending OTS receipts
on:
  pull_request:
    paths:
      - '.github/workflows/w31-ots-readback-verify-one-shot.yml'
permissions:
  contents: read
jobs:
  offline-proof-parse:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install fixed official timestamp format package
        run: python -m pip install 'opentimestamps==0.5.0'
      - name: Parse both captured raw proofs, verify message/digest and detached round trip
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B research/consensus/w31_verify_ots_pending_receipts.py
