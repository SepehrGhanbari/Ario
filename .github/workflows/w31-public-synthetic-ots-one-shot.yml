name: W31 ONE-SHOT public synthetic digest to two OTS calendars
on:
  pull_request:
    paths:
      - '.github/workflows/w31-public-synthetic-ots-one-shot.yml'
permissions:
  contents: read
jobs:
  external-calendar-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Confirm exact public-only synthetic file and print digest locally
        shell: bash
        run: |
          set -euo pipefail
          python -B research/consensus/w31_public_ots_calendar_probe.py --dry-run
      - name: Explicit one-shot opt-in; transmit raw 32-byte digest only to Alice/Bob
        shell: bash
        env:
          ARIO_W31_ONE_SHOT_SYNTHETIC_ALLOWED: '1'
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN GIT_ASKPASS || true
          python -B research/consensus/w31_public_ots_calendar_probe.py --submit
