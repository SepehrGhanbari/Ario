name: W32 two public Bitcoin header API corroboration (one-shot)
on:
  pull_request:
    paths:
      - 'research/consensus/w32_public_bitcoin_header_corrob.py'
      - 'research/consensus/test_w32_public_bitcoin_header_corrob.py'
      - '.github/workflows/w32-bitcoin-header-readonly-one-shot.yml'
permissions:
  contents: read
jobs:
  offline-header-falsifiers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'opentimestamps==0.5.0'
      - name: Check exact public W31 proof binding + 22 no-network adversarial checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w32_public_bitcoin_header_corrob.py -v
  explicit-read-only-public-header-get:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'opentimestamps==0.5.0'
      - name: Offline verify two actual upgraded W31 proofs by SHA before network
        run: python -B research/consensus/w32_public_bitcoin_header_corrob.py --offline
      - name: Compare 2 proof merkle roots with 2 public API 80-byte block headers (GET ONLY)
        env:
          ARIO_W32_HEADER_READONLY_ALLOW: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B research/consensus/w32_public_bitcoin_header_corrob.py --read-only-explorer-get
