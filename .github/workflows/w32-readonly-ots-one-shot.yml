name: W32 existing OpenTimestamps proof GET only (one-shot)
on:
  pull_request:
    paths:
      - 'research/consensus/w32_read_only_ots_upgrade.py'
      - 'research/consensus/test_w32_read_only_ots_upgrade.py'
      - '.github/workflows/w32-readonly-ots-one-shot.yml'
permissions:
  contents: read
jobs:
  offline-falsifiers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'opentimestamps==0.5.0'
      - name: 19 strict no-network W32 tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w32_read_only_ots_upgrade.py -v
  one-shot-read-only-get:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'opentimestamps==0.5.0'
      - name: Reconfirm original public W31 proof binding (NO NETWORK)
        run: python -B research/consensus/w32_read_only_ots_upgrade.py --offline
      - name: Read only GET /timestamp/COMMITMENT from original Alice/Bob calendars
        env:
          ARIO_W32_READONLY_GET_ALLOW: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B research/consensus/w32_read_only_ots_upgrade.py --read-only-get
