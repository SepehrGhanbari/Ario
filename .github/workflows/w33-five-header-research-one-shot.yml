name: W33 bounded Bitcoin five-header continuity research (one-shot)
on:
  pull_request:
    paths:
      - 'research/consensus/w33_five_header_chain_and_core_gate.py'
      - 'research/consensus/test_w33_five_header_chain_and_core_gate.py'
      - '.github/workflows/w33-five-header-research-one-shot.yml'
permissions:
  contents: read
jobs:
  offline-falsifiers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 26 adversarial W33 header/Pow/Core anti-authority checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w33_five_header_chain_and_core_gate.py -v
  one-shot-read-only-public-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact W32 public anchors OFFLINE first
        run: python -B research/consensus/w33_five_header_chain_and_core_gate.py --offline
      - name: Strict only-GET 976597, 976599, 976600 from two public providers
        env:
          ARIO_W33_READONLY_ALLOW: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B research/consensus/w33_five_header_chain_and_core_gate.py --read-only-get
