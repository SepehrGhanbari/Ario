name: W34 CLI negative exit regression (research one-shot)
on:
  pull_request:
    paths:
      - 'research/consensus/w34_local_bitcoin_core_receipt_gate.py'
      - 'research/consensus/test_w34_local_bitcoin_core_receipt_gate.py'
      - '.github/workflows/w34-cli-failclosed-one-shot.yml'
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'opentimestamps==0.5.0'
      - name: 44 offline and CLI fail-closed fake-node checks
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w34_local_bitcoin_core_receipt_gate.py -v
