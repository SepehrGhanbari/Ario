name: W34 local Core RPC admission falsifiers (one-shot / NO REAL NODE)
on:
  pull_request:
    paths:
      - 'research/consensus/w34_local_bitcoin_core_receipt_gate.py'
      - 'research/consensus/test_w34_local_bitcoin_core_receipt_gate.py'
      - '.github/workflows/w34-core-rpc-research-one-shot.yml'
permissions:
  contents: read
jobs:
  offline-fake-rpc-falsifiers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OTS decoding only (no Bitcoin Core node, no wallet)
        run: python -m pip install 'opentimestamps==0.5.0'
      - name: 40 original W31/W32 proof binding + forged Core RPC falsifiers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s research/consensus -p test_w34_local_bitcoin_core_receipt_gate.py -v
      - name: Verify exact original published W31 OTS artifacts offline; no node
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B research/consensus/w34_local_bitcoin_core_receipt_gate.py --offline
  environment-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Research-only local binary inventory — do not install or sync
        shell: bash
        run: |
          set -euo pipefail
          if command -v bitcoin-cli >/dev/null; then
            echo 'BITCOIN_CLI_BINARY_PRESENT__NOT_PROOF_OF_SYNC_OR_VALIDATION'
          else
            echo 'BITCOIN_CLI_BINARY_ABSENT__FULL_CORE_VERIFICATION_NOT_EXECUTED'
          fi
          echo 'W34_NO_LOCAL_CORE_RPC_CONTACT_NO_NEW_BLOCK_DOWNLOAD_NO_TRUST'
