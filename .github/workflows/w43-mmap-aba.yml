name: W43 Synthetic mmap ABA Negative Controls

on:
  pull_request:
    paths:
      - implementation/tests/test_w43_mmap_aba.py
      - implementation/W43_MMAP_ABA_RESEARCH.md
      - .github/workflows/w43-mmap-aba.yml

permissions:
  contents: read

jobs:
  bounded-w43-probe:
    name: W43 probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned research dependencies
        run: python -m pip install -r requirements-research.txt
      - name: Run synthetic W43 probes with visible XFAIL and SKIP reasons
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python -B -m pytest -p no:cacheprovider -q -rxs tests/test_w43_mmap_aba.py

# XFAIL is a reproduced security weakness, never a mitigation PASS.
# This workflow cannot attest historical provenance or signer trust.
