name: Published TXT Restore Security
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  restore-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run isolated restore security tests
        working-directory: releases/ai-readable-full-2026-11-11-05ba5c9
        run: python -m unittest -v test_restore_from_txt.py
